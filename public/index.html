<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Result Ledger — Cryptographic Exam Verification</title>
<style>
:root{
  --bg:#f4f6f8;--bg-elev:#ffffff;--bg-subtle:#eef2f5;--bg-code:#f8fafc;
  --ink:#0f172a;--ink-2:#334155;--mute:#64748b;--line:#e2e8f0;--line-strong:#cbd5e1;
  --brand:#059669;--brand-hover:#047857;--brand-soft:#ecfdf5;--brand-border:#a7f3d0;
  --bad:#dc2626;--bad-soft:#fef2f2;--bad-border:#fecaca;
  --warn:#d97706;--warn-soft:#fffbeb;--warn-border:#fde68a;
  --info:#2563eb;--info-soft:#eff6ff;--info-border:#bfdbfe;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.04);
  --shadow-lg:0 10px 30px rgba(15,23,42,.08);
  --radius:12px;--radius-sm:8px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#09111a;--bg-elev:#101c28;--bg-subtle:#162535;--bg-code:#0c1622;
  --ink:#f1f5f9;--ink-2:#cbd5e1;--mute:#8fa3b8;--line:#1e3044;--line-strong:#2c445e;
  --brand:#10b981;--brand-hover:#34d399;--brand-soft:rgba(16,185,129,.12);--brand-border:rgba(16,185,129,.35);
  --bad:#f87171;--bad-soft:rgba(248,113,113,.12);--bad-border:rgba(248,113,113,.35);
  --warn:#fbbf24;--warn-soft:rgba(251,191,36,.12);--warn-border:rgba(251,191,36,.35);
  --info:#60a5fa;--info-soft:rgba(96,165,250,.12);--info-border:rgba(96,165,250,.35);
  --shadow:0 1px 3px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.25);
  --shadow-lg:0 14px 36px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(circle at 15% 0%,var(--brand-soft) 0%,transparent 42%);
  color:var(--ink);
  font:15px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
code,.mono{font-family:ui-monospace,"Cascadia Code","JetBrains Mono",Menlo,monospace}
.mono{font-size:.78rem;word-break:break-all;color:var(--mute)}

/* Header & Navigation */
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--bg-elev) 88%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1060px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--brand),#0d9488);
  color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(5,150,105,.25);
  flex-shrink:0;
}
.brand-title{font-weight:700;font-size:1.05rem;letter-spacing:-.02em;line-height:1.15}
.brand-sub{font-size:.74rem;color:var(--mute);display:block}
.nav{
  display:flex;gap:4px;background:var(--bg-subtle);padding:4px;border-radius:10px;border:1px solid var(--line);
}
.nav a{
  padding:7px 14px;border-radius:7px;font-size:.86rem;font-weight:600;color:var(--mute);
  display:inline-flex;align-items:center;gap:6px;transition:all .15s ease;
}
.nav a:hover{color:var(--ink)}
.nav a.on{background:var(--bg-elev);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.nav-right{display:flex;align-items:center;gap:8px}
.theme-btn{
  width:36px;height:36px;padding:0;border-radius:9px;display:grid;place-items:center;
  background:var(--bg-subtle);color:var(--ink-2);border:1px solid var(--line);
}
.theme-btn:hover{border-color:var(--line-strong);color:var(--ink);background:var(--bg-elev)}

/* Main Container */
main{max-width:1060px;margin:0 auto;padding:28px 20px 64px}
.page-head{margin-bottom:20px}
.page-head h2{margin:0 0 4px;font-size:1.55rem;letter-spacing:-.025em}
.page-head p{margin:0;color:var(--mute);font-size:.94rem}

/* Cards & Grid */
.card{
  background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;margin-bottom:18px;box-shadow:var(--shadow);
}
.card-title{
  font-size:1rem;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em;
}
.card-desc{margin:0 0 14px;color:var(--mute);font-size:.86rem}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{
  background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);
}
.kpi-label{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600}
.kpi-val{font-size:1.5rem;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.kpi-sub{font-size:.78rem;color:var(--mute);margin-top:2px}

/* Inputs & Buttons */
label.field{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:600;color:var(--ink-2);flex:1;min-width:150px}
input,textarea,button{font:inherit;transition:all .15s ease}
input,textarea{
  padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);
  background:var(--bg-elev);color:var(--ink);width:100%;
}
input:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{min-height:122px;font-family:ui-monospace,Menlo,monospace;font-size:.84rem;resize:vertical}
button{
  padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--brand);
  background:var(--brand);color:#fff;font-weight:600;font-size:.88rem;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;
}
button:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
button:disabled{opacity:.55;cursor:not-allowed}
button.ghost{background:var(--bg-elev);color:var(--ink);border-color:var(--line-strong)}
button.ghost:hover{background:var(--bg-subtle);border-color:var(--mute)}
button.subtle{background:var(--bg-subtle);color:var(--ink-2);border-color:transparent}
button.subtle:hover{background:var(--line);color:var(--ink)}
button.sm{padding:6px 11px;font-size:.8rem;border-radius:7px}
button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row-end{align-items:flex-end}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* Badges & Status Banners */
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:.74rem;font-weight:700;letter-spacing:.01em;border:1px solid transparent;
}
.badge.good{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-border)}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-border)}
.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-border)}
.badge.info{background:var(--info-soft);color:var(--info);border-color:var(--info-border)}
.badge.neutral{background:var(--bg-subtle);color:var(--ink-2);border-color:var(--line)}

.banner{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:14px 16px;border-radius:10px;border:1px solid var(--line);margin-bottom:16px;
}
.banner.good{background:var(--brand-soft);border-color:var(--brand-border)}
.banner.warn{background:var(--warn-soft);border-color:var(--warn-border)}
.banner.bad{background:var(--bad-soft);border-color:var(--bad-border)}
.banner-title{font-weight:700;font-size:1.08rem;display:flex;align-items:center;gap:8px}
.banner.good .banner-title{color:var(--brand)}
.banner.warn .banner-title{color:var(--warn)}
.banner.bad .banner-title{color:var(--bad)}
.banner-sub{font-size:.84rem;color:var(--ink-2);margin-top:2px}

/* Verification Result Details */
.result-meta{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;
  padding:14px;background:var(--bg-subtle);border-radius:10px;border:1px solid var(--line);margin-bottom:14px;
}
.meta-k{font-size:.73rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:600}
.meta-v{font-size:1.05rem;font-weight:700;margin-top:2px}
.score-bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}
.score-fill{height:100%;border-radius:999px;background:var(--brand)}
.corr-box{
  padding:12px 14px;border-radius:9px;background:var(--info-soft);border:1px solid var(--info-border);
  margin-bottom:14px;font-size:.88rem;
}
.checklist{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:8px;margin:12px 0}
.chk{
  display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;
  background:var(--bg-code);border:1px solid var(--line);font-size:.84rem;font-weight:500;
}
.chk-ico{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-size:.72rem;font-weight:800}
.chk.ok .chk-ico{background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand-border)}
.chk.fail .chk-ico{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-border)}
.chk.na .chk-ico{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-border)}

details.proof-box{
  margin-top:12px;border:1px solid var(--line);border-radius:9px;background:var(--bg-code);overflow:hidden;
}
details.proof-box summary{
  padding:10px 14px;cursor:pointer;font-size:.84rem;font-weight:600;color:var(--ink-2);
  list-style:none;display:flex;align-items:center;justify-content:space-between;
}
details.proof-box summary::-webkit-details-marker{display:none}
details.proof-box[open] summary{border-bottom:1px solid var(--line)}
.proof-inner{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.hash-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 8px;border-radius:6px;background:var(--bg-elev);border:1px solid var(--line)}
.hash-tag{font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--mute);min-width:96px}
.hash-val{font-family:ui-monospace,Menlo,monospace;font-size:.76rem;color:var(--ink-2);word-break:break-all;flex:1}
.merkle-steps{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.m-step{display:flex;align-items:center;gap:8px;font-size:.76rem;font-family:ui-monospace,Menlo,monospace;color:var(--mute)}
.m-side{padding:1px 6px;border-radius:4px;font-weight:700;background:var(--bg-subtle);color:var(--ink);border:1px solid var(--line)}

/* Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:.87rem}
th{
  text-align:left;padding:10px 12px;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;
  color:var(--mute);background:var(--bg-subtle);border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:color-mix(in srgb,var(--bg-subtle) 55%,transparent)}
img.qr{background:#fff;border:1px solid var(--line);padding:4px;border-radius:6px;display:block}
img.qr-sm{width:56px;height:56px}
img.qr-lg{width:156px;height:156px;padding:8px;border:1px solid #cbd5e1;border-radius:10px}

/* Chain Visualizer in Audit */
.chain-strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;align-items:center}
.block-node{
  min-width:210px;padding:12px;border-radius:10px;background:var(--bg-code);
  border:1px solid var(--line);flex-shrink:0;
}
.block-node.genesis{min-width:128px;text-align:center;border-style:dashed}
.block-arrow{color:var(--brand);font-weight:800;font-size:1.1rem;flex-shrink:0}

/* Official Printable Marksheet */
.sheet{
  background:#ffffff;color:#0f172a;border:1px solid #cbd5e1;border-radius:12px;
  padding:28px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;
}
.sheet-frame{border:2px solid #0f172a;border-radius:8px;padding:24px}
.sheet-header{
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;
  border-bottom:2px solid #0f172a;padding-bottom:14px;margin-bottom:20px;
}
.sheet-title{margin:0;font:700 1.5rem Georgia,"Times New Roman",serif;color:#0f172a}
.sheet-sub{font-size:.84rem;color:#475569;margin-top:3px}
.sheet-grid{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start}
.sheet table{border:1px solid #e2e8f0;border-radius:8px;overflow:hidden}
.sheet th{background:#f8fafc;color:#475569;width:38%;border-bottom:1px solid #e2e8f0}
.sheet td{color:#0f172a;background:#fff;border-bottom:1px solid #e2e8f0}
.sheet-qr{
  text-align:center;padding:14px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;
}
.sheet-crypto{
  margin-top:20px;padding-top:14px;border-top:1px dashed #94a3b8;
  font-family:ui-monospace,Menlo,monospace;font-size:.74rem;color:#475569;line-height:1.6;word-break:break-all;
}

/* Auth Card & Empty States */
.auth-box{max-width:460px;margin:24px auto;text-align:left}
.empty{text-align:center;padding:28px 16px;color:var(--mute);font-size:.9rem}
.file-label{
  display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:var(--radius-sm);
  border:1px dashed var(--line-strong);background:var(--bg-subtle);color:var(--ink-2);
  font-size:.82rem;font-weight:600;cursor:pointer;
}
.file-label:hover{border-color:var(--brand);color:var(--brand)}

/* Toast */
#toast{
  position:fixed;right:20px;bottom:20px;z-index:100;max-width:380px;
  padding:12px 16px;border-radius:10px;font-size:.86rem;font-weight:600;
  box-shadow:var(--shadow-lg);border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);
  transform:translateY(120%);opacity:0;transition:all .22s ease;pointer-events:none;
}
#toast.show{transform:translateY(0);opacity:1}
#toast.good{border-color:var(--brand-border);background:var(--brand-soft);color:var(--brand)}
#toast.bad{border-color:var(--bad-border);background:var(--bad-soft);color:var(--bad)}

@media (max-width:760px){
  .grid-2{grid-template-columns:1fr}
  .sheet-grid{grid-template-columns:1fr}
  .sheet-qr{display:flex;flex-direction:column;align-items:center}
  .topbar-inner{padding:10px 14px}
  main{padding:18px 14px 52px}
}
@media print{
  body{background:#fff!important;color:#000!important}
  .topbar,.noprint,#toast{display:none!important}
  main{max-width:none;padding:0;margin:0}
  .sheet{box-shadow:none;border:none;padding:0}
  .sheet-frame{border:2px solid #000}
}
</style>
</head>
<body>
<header class="topbar noprint">
  <div class="topbar-inner">
    <a href="#verify" class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
      <div>
        <span class="brand-title">Result Ledger</span>
        <span class="brand-sub">Tamper-Proof Exam Verification</span>
      </div>
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="#verify" id="t-verify">Verify Result</a>
      <a href="#admin" id="t-admin">Registrar</a>
      <a href="#audit" id="t-audit">Integrity Audit</a>
    </nav>
    <div class="nav-right">
      <button type="button" class="theme-btn" id="themeBtn" title="Toggle light/dark theme" aria-label="Toggle theme"></button>
    </div>
  </div>
</header>

<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $=s=>document.querySelector(s), app=$('#app'), enc=encodeURIComponent;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GENESIS='0'.repeat(64);
const hasSubtle=!!(globalThis.crypto&&crypto.subtle);

/* Theme Management */
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  localStorage.setItem('rl_theme',t);
  $('#themeBtn').innerHTML=t==='dark'
    ? '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
    : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
}
applyTheme(localStorage.getItem('rl_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('#themeBtn').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

/* Toast & Clipboard Helpers */
let toastTimer;
function toast(msg,kind='good'){
  const el=$('#toast');
  el.textContent=msg;el.className=`show ${kind}`;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{el.className='';},3400);
}
async function copyText(txt,label='Copied'){
  try{await navigator.clipboard.writeText(txt);toast(`${label} copied to clipboard`);}
  catch{toast('Copy failed — select manually','bad');}
}

/* Client-Side Cryptographic Primitives (matches lib/ledger.js byte-for-byte) */
const sha=async b=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',b))].map(x=>x.toString(16).padStart(2,'0')).join('');
const shaStr=s=>sha(new TextEncoder().encode(s));
const hexB=h=>Uint8Array.from(h.match(/../g)||[],x=>parseInt(x,16));
const cat=(...a)=>{const o=new Uint8Array(a.reduce((n,x)=>n+x.length,0));let i=0;a.forEach(x=>{o.set(x,i);i+=x.length});return o};
const canon=r=>JSON.stringify(['v1',r.batch,r.student_id,r.course,Number(r.marks),r.version,r.supersedes||null,r.reason||'',r.approvals||[]]);
const leafOf=r=>sha(cat(Uint8Array.of(0),new TextEncoder().encode(canon(r))));
const headOf=c=>shaStr(JSON.stringify(['hdr',c.n,c.root,c.prev,c.count,c.ts]));
const corrDigestOf=r=>shaStr(JSON.stringify(['corr',r.student_id,r.course,Number(r.marks),r.reason,r.supersedes]));
async function rootOf(leaf,proof){
  let h=leaf;
  for(const s of proof){
    const a=hexB(s.hash),b=hexB(h);
    h=await sha(cat(Uint8Array.of(1),...(s.side==='L'?[a,b]:[b,a])));
  }
  return h;
}

const keyCache=new Map();
function pemToDer(pem){
  const b64=pem.replace(/-----[^-]+-----|\s+/g,'');
  return Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
}
async function verifyEd25519(pubPem,msgHex,sigHex){
  if(!hasSubtle)return null;
  try{
    let k=keyCache.get(pubPem);
    if(!k){
      k=await crypto.subtle.importKey('spki',pemToDer(pubPem),{name:'Ed25519'},false,['verify']);
      keyCache.set(pubPem,k);
    }
    return await crypto.subtle.verify('Ed25519',k,hexB(sigHex),hexB(msgHex));
  }catch{return null;}
}

const api=async(p,body,tok)=>{
  const r=await fetch(p,{method:body?'POST':'GET',headers:{'content-type':'application/json','x-token':tok||''},body:body&&JSON.stringify(body)});
  return{ok:r.ok,status:r.status,j:await r.json()};
};
const qrLink=r=>`${location.origin}/#verify?s=${enc(r.student_id)}&c=${enc(r.course)}&h=${r.leaf}`;
const sheetLink=r=>`#marksheet?s=${enc(r.student_id)}&c=${enc(r.course)}&h=${r.leaf}`;
const hashArgs=()=>new URLSearchParams(location.hash.split('?')[1]||'');

function route(){
  const v=(location.hash.slice(1).split('?')[0])||'verify';
  ['verify','admin','audit'].forEach(t=>$('#t-'+t).classList.toggle('on',t===v));
  ({verify,admin,audit,marksheet})[v]?.();
}
addEventListener('hashchange',route);addEventListener('load',route);

/* ---------------- PUBLIC VERIFICATION VIEW ---------------- */
function verify(){
  const q=hashArgs();
  app.innerHTML=`
    <div class="page-head">
      <h2>Public Result Verification</h2>
      <p>Independently verifies SHA-256 leaf hashes, Merkle inclusion proofs, hash-chain links, and Ed25519 signatures directly inside your browser.</p>
    </div>
    <div class="card noprint">
      <form class="row row-end" id="f">

async function runVerify(s,c,h){
  const out=$('#out');
  if(!hasSubtle){
    out.innerHTML=`<div class="card"><div class="banner bad"><div><div class="banner-title">Secure Context Required</div><div class="banner-sub">Browser WebCrypto (<code>crypto.subtle</code>) requires HTTPS or localhost to recompute proofs locally.</div></div></div></div>`;
    return;
  }
  out.innerHTML='<div class="card empty">Recomputing SHA-256 leaf, Merkle proof, and Ed25519 signatures in browser…</div>';
  const [{j:res},{j:cp}]=await Promise.all([api(`/api/result?s=${enc(s)}${c?'&c='+enc(c):''}`),api('/api/checkpoints')]);
  if(!res.results?.length){
    out.innerHTML=`<div class="card"><div class="banner bad" style="margin:0"><div><div class="banner-title">No Published Result Found</div><div class="banner-sub">No ledger record exists for student “${esc(s)}”${c?` in course “${esc(c)}”`:''}. Double-check the ID or contact the registrar.</div></div></div></div>`;
    return;
  }

  const cpMap=new Map();
  let prev=GENESIS, chainBroken=false;
  for(const k of cp.checkpoints){
    const calcHead=await headOf(k);
    const sigOk=await verifyEd25519(cp.ledger_pub,k.head,k.sig);
    const linkOk=k.prev===prev && calcHead===k.head && !chainBroken;
    if(!linkOk || sigOk===false) chainBroken=true;
    cpMap.set(k.n,{cp:k,linkOk,sigOk});
    prev=k.head;
  }

  const cards=[];
  for(const x of res.results){
    const leaf=await leafOf(x.record);
    const meta=cpMap.get(x.record.batch);
    const cpb=meta?.cp;
    const calcRoot=await rootOf(leaf,x.proof);
    const leafOk=leaf===x.leaf;
    const rootOk=!!cpb&&calcRoot===cpb.root;
    const chainOk=!!meta?.linkOk;
    const sigOk=meta?meta.sigOk:false;

    let corrOk=true, corrChecked=false;
    if(x.record.version>1){
      corrChecked=true;
      const d=await corrDigestOf(x.record);
      const validAdmins=new Set();
      let unsupported=false;
      for(const [aid,sig] of (x.record.approvals||[])){
        const pub=cp.admin_pubs?.[aid];
        if(!pub) continue;
        const ok=await verifyEd25519(pub,d,sig);
        if(ok===null){unsupported=true;break;}
        if(ok) validAdmins.add(aid);
      }
      corrOk=unsupported?null:validAdmins.size>=2;
    }

    const qrOk=h?h===leaf:null;
    const valid=leafOk&&rootOk&&chainOk&&sigOk!==false&&corrOk!==false&&qrOk!==false;
    const state=!valid?['bad','Verification Failed — Tampering Detected','One or more cryptographic checks failed against the signed external checkpoint.']
      :x.superseded?['warn','Authentic Historical Record (Superseded)','Cryptographically valid, but officially replaced by a newer signed correction.']
      :['good','Authentic & Current Result','All client-side cryptographic proofs and signatures verified against the signed ledger.'];

    const chk=(label,ok)=>{
      const cls=ok===null?'na':ok?'ok':'fail';
      const ico=ok===null?'i':ok?'✓':'✕';
      return `<div class="chk ${cls}"><span class="chk-ico">${ico}</span><span>${label}${ok===null?' (browser API unavailable; verified on server)':''}</span></div>`;
    };
    const pct=Math.max(0,Math.min(100,Number(x.record.marks)||0));

    cards.push(`<div class="card">
      <div class="banner ${state[0]}">
        <div>
          <div class="banner-title">${state[1]}</div>
          <div class="banner-sub">${state[2]}</div>
        </div>
        <div class="row noprint">
          <a href="${sheetLink({student_id:x.record.student_id,course:x.record.course,leaf:x.leaf})}"><button type="button" class="ghost sm">Official Marksheet</button></a>
        </div>
      </div>

      <div class="result-meta">
        <div><div class="meta-k">Student ID</div><div class="meta-v">${esc(x.record.student_id)}</div></div>
        <div><div class="meta-k">Course</div><div class="meta-v">${esc(x.record.course)}</div></div>
        <div>
          <div class="meta-k">Marks Awarded</div>
          <div class="meta-v">${x.record.marks} <span style="font-size:.82rem;color:var(--mute);font-weight:500">/ 100</span></div>
          <div class="score-bar"><div class="score-fill" style="width:${pct}%"></div></div>
        </div>
        <div>
          <div class="meta-k">Ledger Version</div>
          <div class="meta-v">v${x.record.version} <span class="badge ${x.superseded?'warn':'good'}" style="margin-left:4px">${x.superseded?'Superseded':'Current'}</span></div>
          <div class="kpi-sub">Batch #${x.batch.n} · ${new Date(x.batch.ts).toLocaleDateString()}</div>
        </div>
      </div>

      ${x.record.reason?`<div class="corr-box">
        <b>Signed Correction Trail:</b> ${esc(x.record.reason)}<br>
        <span style="color:var(--mute)">Approved with Ed25519 signatures by <b>${x.record.approvals.map(a=>esc(a[0])).join('</b> and <b>')}</b> · Supersedes leaf <code>${esc((x.record.supersedes||'').slice(0,16))}…</code></span>
      </div>`:''}

      <div class="checklist">
        ${chk('Canonical SHA-256 leaf hash matches record',leafOk)}
        ${chk('Merkle inclusion proof reconstructs checkpoint root',rootOk)}
        ${chk('Batch header & hash chain linked from genesis',chainOk)}
        ${chk('Ledger Ed25519 signature verified in browser',sigOk)}
        ${corrChecked?chk('Two distinct admin Ed25519 signatures verified',corrOk):''}
        ${h?chk('QR code hash matches this exact record',qrOk):''}
      </div>

      <details class="proof-box">
        <summary>
          <span>Inspect Cryptographic Proof &amp; Merkle Path (${x.proof.length} sibling step${x.proof.length===1?'':'s'})</span>
          <span class="badge neutral">SHA-256 + Ed25519</span>
        </summary>
        <div class="proof-inner">
          <div class="hash-row"><span class="hash-tag">Leaf Hash</span><span class="hash-val">${leaf}</span><button type="button" class="subtle sm" data-copy="${leaf}" data-label="Leaf hash">Copy</button></div>
          <div class="hash-row"><span class="hash-tag">Merkle Root</span><span class="hash-val">${calcRoot}</span><button type="button" class="subtle sm" data-copy="${calcRoot}" data-label="Merkle root">Copy</button></div>
          <div class="hash-row"><span class="hash-tag">Signed Head</span><span class="hash-val">${x.batch.head}</span><button type="button" class="subtle sm" data-copy="${x.batch.head}" data-label="Batch head">Copy</button></div>
          <div class="hash-row"><span class="hash-tag">Prev Head</span><span class="hash-val">${x.batch.prev}</span></div>
          ${x.proof.length?`<div style="margin-top:4px"><div class="meta-k" style="margin-bottom:6px">Merkle Sibling Path (Bottom → Root)</div>
            <div class="merkle-steps">${x.proof.map((st,i)=>`<div class="m-step"><span>#${i+1}</span><span class="m-side">${st.side==='L'?'LEFT':'RIGHT'}</span><span>${st.hash}</span></div>`).join('')}</div>
          </div>`:'<div class="mono">Single-leaf batch — leaf hash is the batch Merkle root.</div>'}
        </div>
      </details>
    </div>`);
  }

  const anyQr=h&&res.results.some(x=>x.leaf===h);
  out.innerHTML=(h&&!anyQr?`<div class="card"><div class="banner bad" style="margin:0"><div><div class="banner-title">Forged or Mismatched QR Code</div><div class="banner-sub">The scanned QR hash does not correspond to any published record for this student. Treat this marksheet as invalid.</div></div></div></div>`:'')+cards.join('');
  out.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(b.dataset.copy,b.dataset.label));
}

    app.innerHTML=`
      <div class="card auth-box">
        <div class="row" style="margin-bottom:12px">
          <div class="brand-mark" style="width:40px;height:40px">

          <div>

            <span class="brand-sub">Authenticate with an authorized admin token (a1, a2, or a3)</span>
          </div>
        </div>
        <form id="loginForm" style="display:flex;flex-direction:column;gap:12px">
          <label class="field">Admin Access Token
            <input id="tok" type="password" placeholder="Paste admin token…" autocomplete="off" required>
          </label>
          <button type="submit">Sign In to Registrar Portal</button>
          <div id="loginErr" class="mono" style="color:var(--bad);min-height:1.2em"></div>

async function loadAdminPortal(){
  const tok=sessionStorage.tok||'';
  const {ok,j}=await api('/api/records',null,tok);
  if(!ok){
    sessionStorage.removeItem('tok');
    toast(j.error||'Session expired','bad');
    admin();
    return;
  }
  renderAdminPortal(j);
}

function renderAdminPortal(j){
  const tok=sessionStorage.tok||'';
  const maxVer=new Map();
  let maxBatch=0;
  j.records.forEach(r=>{
    const k=r.student_id+'|'+r.course;
    maxVer.set(k,Math.max(maxVer.get(k)||0,r.version));
    if(r.batch>maxBatch) maxBatch=r.batch;
  });

  app.innerHTML=`
    <div class="between page-head noprint">
      <div>
        <h2>Registrar Console</h2>
        <p>Publish signed exam batches and manage two-admin cryptographic corrections.</p>
      </div>
      <div class="row">
        <span class="badge good">Active Admin: ${esc(j.admin)}</span>
        <button type="button" class="ghost sm" id="switchBtn">Switch Admin</button>
      </div>
    </div>

    <div class="kpis noprint">
      <div class="kpi"><div class="kpi-label">Published Records</div><div class="kpi-val">${j.records.length}</div><div class="kpi-sub">Append-only entries</div></div>
      <div class="kpi"><div class="kpi-label">Signed Batches</div><div class="kpi-val">${maxBatch}</div><div class="kpi-sub">Merkle-rooted &amp; chained</div></div>
      <div class="kpi"><div class="kpi-label">Pending Multi-Sig</div><div class="kpi-val">${j.pending.length}</div><div class="kpi-sub">Awaiting 2nd signature</div></div>
      <div class="kpi"><div class="kpi-label">Signed-In Role</div><div class="kpi-val">${esc(j.admin)}</div><div class="kpi-sub">Ed25519 key active</div></div>
    </div>

    <div class="grid-2 noprint">
      <div class="card">
        <div class="between" style="margin-bottom:6px">
          <h3 class="card-title">Publish Exam Batch</h3>
          <div class="row">
            <label class="file-label">Upload .CSV<input type="file" id="csvFile" accept=".csv,text/csv,text/plain" hidden></label>
            <button type="button" class="subtle sm" id="sampleBtn">Load Sample</button>
          </div>
        </div>
        <p class="card-desc">Format: <code>student_id,course,marks</code> — each batch builds a fresh Merkle root and signed checkpoint.</p>
        <textarea id="csv" placeholder="student_id,course,marks&#10;REG101,CSE101,84&#10;REG102,CSE101,92"></textarea>
        <div class="between" style="margin-top:10px">
          <span class="mono" id="csvHint">Marks range: 0–100 (decimals supported)</span>
          <button type="button" id="pub">Publish Signed Batch</button>
        </div>
      </div>

      <div class="card">
        <h3 class="card-title">Propose Result Correction</h3>
        <p class="card-desc">Never overwrites history. Creates a pending digest requiring <b>two distinct admin</b> Ed25519 signatures.</p>
        <form id="propForm" style="display:flex;flex-direction:column;gap:10px">
          <div class="row">
            <label class="field">Student ID<input id="cs" placeholder="REG101" required></label>
            <label class="field">Course<input id="cc" placeholder="CSE101" required></label>
            <label class="field" style="max-width:130px">New Marks<input id="cm" type="number" step="any" min="0" max="100" placeholder="0-100" required></label>
          </div>
          <label class="field">Documented Reason (min 5 characters)
            <input id="cr" placeholder="e.g. Official re-evaluation panel update" minlength="5" required>
          </label>
          <div class="between">
            <span class="mono">Supersedes latest published version</span>
            <button type="submit">Propose Correction</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card noprint">
      <div class="between" style="margin-bottom:10px">
        <div>
          <h3 class="card-title">Pending Two-Admin Approval Queue</h3>
          <p class="card-desc" style="margin-bottom:0">Each proposal needs cryptographic signatures from 2 different admins before anchoring to the ledger.</p>
        </div>
        <span class="badge ${j.pending.length?'warn':'neutral'}">${j.pending.length} open</span>
      </div>
      ${j.pending.length?`<div class="table-wrap"><table>
        <thead><tr><th>ID</th><th>Student / Course</th><th>New Marks</th><th>Documented Reason</th><th>Signatures</th><th>Action</th></tr></thead>
        <tbody>${j.pending.map(p=>{
          const count=p.approvals.length, selfSigned=p.approvals.includes(j.admin);
          return `<tr>
            <td><b>#${p.id}</b></td>
            <td><b>${esc(p.student_id)}</b> <span class="mono">${esc(p.course)}</span></td>

          </tr>`;
        }).join('')}</tbody>
      </table></div>`:'<div class="empty">No pending corrections right now.</div>'}
    </div>

    <div class="card">
      <div class="between" style="margin-bottom:12px">
        <div>
          <h3 class="card-title">Published Ledger Records</h3>
          <p class="card-desc" style="margin-bottom:0">Complete append-only history including superseded versions.</p>
        </div>
        <div class="row noprint">
          <input id="recFilter" placeholder="Filter by student or course…" style="width:220px;padding:7px 10px;font-size:.84rem">
          <button type="button" class="ghost sm" onclick="window.print()">Print Table</button>
        </div>
      </div>
      ${j.records.length?`<div class="table-wrap"><table>
        <thead><tr><th>Batch</th><th>Student</th><th>Course</th><th>Marks</th><th>Status</th><th>QR Code</th><th class="noprint">Actions</th></tr></thead>
        <tbody id="recBody">${renderRecordRows(j.records,maxVer)}</tbody>
      </table></div>`:'<div class="empty">No exam results published yet. Paste CSV rows above or click “Load Sample” to publish your first batch.</div>'}
    </div>`;

  $('#switchBtn').onclick=()=>{sessionStorage.removeItem('tok');admin();};
  $('#sampleBtn').onclick=()=>{
    const rand=Math.floor(100+Math.random()*899);
    $('#csv').value=`student_id,course,marks\nREG${rand}1,CSE101,78\nREG${rand}2,CSE101,91\nREG${rand}3,CSE101,65`;
    toast('Loaded sample CSV rows');
  };
  $('#csvFile').onchange=e=>{
    const f=e.target.files?.[0];
    if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{$('#csv').value=String(rd.result||'');toast(`Loaded ${f.name}`);};

  };
  $('#pub').onclick=async()=>{
    const r=await api('/api/publish',{csv:$('#csv').value},tok);
    if(!r.ok)return toast(r.j.error,'bad');
    toast(`Batch #${r.j.n} published (${r.j.count} records)`);
    loadAdminPortal();
  };
  $('#propForm').onsubmit=async e=>{
    e.preventDefault();
    const r=await api('/api/corrections',{student_id:$('#cs').value.trim(),course:$('#cc').value.trim(),marks:$('#cm').value,reason:$('#cr').value},tok);
    if(!r.ok)return toast(r.j.error,'bad');
    toast(`Correction #${r.j.id} proposed — needs 2 distinct signatures`);
    loadAdminPortal();
  };
  document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=async()=>{
    const r=await api(`/api/corrections/${b.dataset.ap}/approve`,{},tok);
    if(!r.ok)return toast(r.j.error,'bad');
    toast(r.j.status==='published'?`Correction published in Batch #${r.j.n}!`:`Signed by ${j.admin} (1/2) — switch admin for 2nd signature`);
    loadAdminPortal();
  });
  if($('#recFilter'))$('#recFilter').oninput=e=>{
    const q=e.target.value.trim().toLowerCase();
    const filtered=q?j.records.filter(r=>r.student_id.toLowerCase().includes(q)||r.course.toLowerCase().includes(q)):j.records;
    $('#recBody').innerHTML=filtered.length?renderRecordRows(filtered,maxVer):'<tr><td colspan="7" class="empty">No matching records.</td></tr>';
  };
}

function renderRecordRows(records,maxVer){
  return records.slice().reverse().map(r=>{
    const isOld=r.version<maxVer.get(r.student_id+'|'+r.course);
    return `<tr>
      <td><span class="badge neutral">#${r.batch}</span></td>
      <td><b>${esc(r.student_id)}</b></td>
      <td>${esc(r.course)}</td>
      <td><b>${r.marks}</b></td>
      <td>v${r.version} <span class="badge ${isOld?'warn':'good'}" style="margin-left:4px">${isOld?'Superseded':'Current'}</span></td>
      <td><img class="qr qr-sm" loading="lazy" alt="QR" src="/api/qr?text=${enc(qrLink(r))}"></td>
      <td class="noprint"><div class="row">
        <a href="${sheetLink(r)}"><button type="button" class="ghost sm">Marksheet</button></a>
        <a href="#verify?s=${enc(r.student_id)}&c=${enc(r.course)}&h=${r.leaf}"><button type="button" class="subtle sm">Verify</button></a>
      </div></td>
    </tr>`;
  }).join('');
}

      <button type="button" id="go">

        <div class="kpi"><div class="kpi-label">Batches Audited</div><div class="kpi-val">${j.batches}</div><div class="kpi-sub">Hash-chain verified</div></div>
        <div class="kpi"><div class="kpi-label">Records Verified</div><div class="kpi-val">${j.records}</div><div class="kpi-sub">Merkle leaves checked</div></div>
        <div class="kpi"><div class="kpi-label">Violations Found</div><div class="kpi-val" style="color:${j.issues.length?'var(--bad)':'var(--brand)'}">${j.issues.length}</div><div class="kpi-sub">${j.issues.length?'Pinpointed below':'Zero anomalies'}</div></div>
      </div>
      <div class="card">
        <div class="banner ${j.ok?'good':'bad'}" style="margin-bottom:${j.issues.length?14:0}px">
          <div>
            <div class="banner-title">${j.ok?'Ledger Intact — Zero Tampering Detected':`${j.issues.length} Integrity Violation${j.issues.length>1?'s':''} Pinpointed`}</div>
            <div class="banner-sub">${j.ok?'Every SQLite record, batch Merkle root, Ed25519 signature, and pending correction matches the signed external checkpoints.':'Unauthorized modifications bypassing the application workflow were detected in SQLite.'}</div>
          </div>
        </div>
        ${j.issues.length?`<div class="table-wrap"><table>
          <thead><tr><th>Scope</th><th>Student / Index</th><th>Detected Tampering Issue</th></tr></thead>
          <tbody>${j.issues.map(i=>`<tr>
            <td><span class="badge bad">${i.batch===0?'Pending Table':`Batch #${i.batch}`}</span></td>
            <td>${i.student?`<b>${esc(i.student)}</b> / ${esc(i.course)}`:'Batch Header'}${i.idx!==undefined?` <span class="mono">(idx ${i.idx})</span>`:''}</td>
            <td style="color:var(--bad);font-weight:600">${esc(i.problem)}</td>
          </tr>`).join('')}</tbody>
        </table></div>`:''}
      </div>`;

    if(!cp.checkpoints?.length){
      $('#chainOut').innerHTML='<div class="empty">No batches anchored yet. Publish a batch in the Registrar tab to initialize Batch #1.</div>';
    }else{
      $('#chainOut').innerHTML=`<div class="chain-strip">
        <div class="block-node genesis"><div class="badge neutral">GENESIS</div><div class="mono" style="margin-top:6px">00000000…0000</div></div>
        ${cp.checkpoints.map(c=>`<div class="block-arrow">→</div>
          <div class="block-node">
            <div class="between"><b>Batch #${c.n}</b><span class="badge good">${c.count} leaf${c.count===1?'':'s'}</span></div>

          </div>`).join('')}
      </div>`;
    }
  };
  $('#go').onclick=run;
  run();
}
