<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Result Ledger — Examination Verification Registry</title>
<style>
:root{
  --bg:#f8f7f4;
  --surface:#ffffff;
  --surface-2:#f1efe9;
  --ink:#141619;
  --ink-2:#3b414b;
  --mute:#656d78;
  --border:#d6d9df;
  --border-strong:#141619;
  --accent:#1b365d;
  --accent-hover:#112440;
  --ok:#145a38;
  --ok-bg:#eef6f1;
  --ok-border:#9ccab2;
  --err:#a61d1d;
  --err-bg:#fdf2f2;
  --err-border:#e5a5a5;
  --warn:#8a5200;
  --warn-bg:#fef8ec;
  --warn-border:#e2c386;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#111316;
  --surface:#171a1f;
  --surface-2:#1e2229;
  --ink:#eceef1;
  --ink-2:#bcc3cd;
  --mute:#848d99;
  --border:#2b313b;
  --border-strong:#6e7785;
  --accent:#35629e;
  --accent-hover:#4375b8;
  --ok:#52c788;
  --ok-bg:#12241b;
  --ok-border:#23543a;
  --err:#f07171;
  --err-bg:#291516;
  --err-border:#662828;
  --warn:#e6b450;
  --warn-bg:#261f11;
  --warn-border:#5e491c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code,.mono{
  font-family:ui-monospace,"Cascadia Code",Consolas,"SFMono-Regular",Menlo,monospace;
  font-variant-numeric:tabular-nums;
}
.mono{font-size:.78rem;color:var(--mute);word-break:break-all}
.num{font-variant-numeric:tabular-nums}

/* Top Masthead */
.masthead{
  background:var(--surface);
  border-top:3px solid var(--accent);
  border-bottom:1px solid var(--border);
}
.masthead-inner{
  max-width:1040px;margin:0 auto;padding:0 20px;
  display:flex;align-items:stretch;justify-content:space-between;gap:20px;flex-wrap:wrap;
}
.site-id{
  padding:14px 0;display:flex;align-items:baseline;gap:10px;color:var(--ink);
}
.site-id:hover{text-decoration:none}
.site-name{
  font:700 1.2rem/1.1 Georgia,"Times New Roman",serif;
  letter-spacing:-.01em;
}
.site-dept{
  font-size:.78rem;color:var(--mute);padding-left:10px;border-left:1px solid var(--border);
}
.nav-wrap{display:flex;align-items:stretch;gap:22px}
.nav{display:flex;align-items:stretch;gap:2px}
.nav a{
  display:flex;align-items:center;padding:15px 12px 13px;
  font-size:.88rem;font-weight:600;color:var(--ink-2);
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.nav a:hover{color:var(--ink);text-decoration:none;border-bottom-color:var(--border-strong)}
.nav a.on{color:var(--ink);border-bottom-color:var(--accent)}
.theme-toggle{
  align-self:center;background:transparent;color:var(--mute);
  border:1px solid var(--border);border-radius:3px;
  padding:5px 10px;font-size:.78rem;font-weight:600;cursor:pointer;
}
.theme-toggle:hover{color:var(--ink);border-color:var(--border-strong);background:var(--surface-2)}

/* Layout */
main{max-width:1040px;margin:0 auto;padding:28px 20px 64px}
.page-head{
  padding-bottom:16px;margin-bottom:22px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
}
.page-head h1{
  margin:0 0 4px;font:700 1.65rem/1.2 Georgia,"Times New Roman",serif;letter-spacing:-.015em;
}
.page-head p{margin:0;color:var(--mute);font-size:.9rem;max-width:68ch}

.section{
  background:var(--surface);border:1px solid var(--border);border-radius:3px;
  padding:20px;margin-bottom:20px;
}
.sec-head{
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
  margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);
}
.sec-head h2{margin:0;font-size:1rem;font-weight:700;letter-spacing:-.01em}
.sec-note{font-size:.82rem;color:var(--mute);margin:0 0 12px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.split .section{margin-bottom:0}

/* Forms & Controls */
label.field{
  display:flex;flex-direction:column;gap:5px;
  font-size:.78rem;font-weight:600;color:var(--ink-2);flex:1;min-width:140px;
}
input,textarea,button{font:inherit}
input,textarea{
  padding:8px 10px;border:1px solid var(--border);border-radius:2px;
  background:var(--surface);color:var(--ink);width:100%;
}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
textarea{
  min-height:118px;font-family:ui-monospace,Consolas,Menlo,monospace;
  font-size:.82rem;line-height:1.5;resize:vertical;
}
button{
  padding:8px 14px;border-radius:2px;border:1px solid var(--accent);
  background:var(--accent);color:#ffffff;font-size:.86rem;font-weight:600;
  cursor:pointer;white-space:nowrap;
}
button:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
button.secondary{
  background:var(--surface);color:var(--ink);border-color:var(--border);
}
button.secondary:hover{background:var(--surface-2);border-color:var(--border-strong)}
button.link-btn{
  background:none;border:none;color:var(--accent);padding:2px 4px;font-size:.82rem;font-weight:600;
}
button.link-btn:hover{background:none;text-decoration:underline}
button.sm{padding:5px 10px;font-size:.78rem}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row-end{align-items:flex-end}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* Status Tags & Verdicts */
.tag{
  display:inline-block;padding:2px 6px;border-radius:2px;
  font:700 .7rem/1.35 ui-monospace,Consolas,monospace;
  letter-spacing:.03em;text-transform:uppercase;border:1px solid transparent;
}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-border)}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-border)}
.tag.err{background:var(--err-bg);color:var(--err);border-color:var(--err-border)}
.tag.neutral{background:var(--surface-2);color:var(--ink-2);border-color:var(--border)}

.verdict{
  display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;
  padding:14px 16px;margin-bottom:16px;border:1px solid var(--border);border-left-width:4px;border-radius:2px;
}
.verdict.ok{background:var(--ok-bg);border-color:var(--ok-border);border-left-color:var(--ok)}
.verdict.warn{background:var(--warn-bg);border-color:var(--warn-border);border-left-color:var(--warn)}
.verdict.err{background:var(--err-bg);border-color:var(--err-border);border-left-color:var(--err)}
.verdict-title{font-weight:700;font-size:1rem;letter-spacing:-.01em}
.verdict.ok .verdict-title{color:var(--ok)}
.verdict.warn .verdict-title{color:var(--warn)}
.verdict.err .verdict-title{color:var(--err)}
.verdict-sub{font-size:.84rem;color:var(--ink-2);margin-top:2px}

/* Summary Metadata Grid */
.spec-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  border:1px solid var(--border);border-radius:2px;margin-bottom:16px;background:var(--surface);
}
.spec-cell{padding:11px 14px;border-right:1px solid var(--border)}
.spec-cell:last-child{border-right:none}
.spec-k{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:600}
.spec-v{font-size:1.05rem;font-weight:700;margin-top:3px}
.spec-sub{font-size:.76rem;color:var(--mute);margin-top:2px}

.note-box{
  padding:10px 14px;border:1px solid var(--border);border-left:3px solid var(--accent);
  background:var(--surface-2);font-size:.85rem;margin-bottom:16px;border-radius:2px;
}

/* Verification Log List */
.check-log{border:1px solid var(--border);border-radius:2px;margin-bottom:14px;overflow:hidden}
.check-row{
  display:flex;align-items:baseline;gap:12px;padding:8px 12px;
  border-bottom:1px solid var(--border);font-size:.84rem;
}
.check-row:last-child{border-bottom:none}
.check-code{
  font:700 .72rem/1 ui-monospace,Consolas,monospace;min-width:50px;flex-shrink:0;
}
.check-code.ok{color:var(--ok)}
.check-code.err{color:var(--err)}
.check-code.na{color:var(--warn)}

/* Technical Proof Drawer */
details.proof{border:1px solid var(--border);border-radius:2px;background:var(--surface-2)}
details.proof summary{
  padding:9px 12px;cursor:pointer;font-size:.83rem;font-weight:600;color:var(--ink-2);
  display:flex;justify-content:space-between;align-items:center;
}
details.proof[open] summary{border-bottom:1px solid var(--border)}
.proof-body{padding:12px;background:var(--surface)}
.kv-table{width:100%;border-collapse:collapse;font-size:.8rem}
.kv-table th{
  text-align:left;width:130px;padding:6px 8px;color:var(--mute);font-weight:600;
  border-bottom:1px solid var(--border);background:transparent;text-transform:none;letter-spacing:0;
}
.kv-table td{padding:6px 8px;border-bottom:1px solid var(--border);word-break:break-all}
.kv-table tr:last-child th,.kv-table tr:last-child td{border-bottom:none}
.merkle-list{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.merkle-item{
  display:flex;gap:10px;align-items:baseline;padding:3px 0;
  font:400 .77rem/1.45 ui-monospace,Consolas,monospace;color:var(--ink-2);
}

/* Data Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{
  text-align:left;padding:9px 11px;font-size:.73rem;text-transform:uppercase;
  letter-spacing:.04em;color:var(--mute);background:var(--surface-2);
  border-bottom:1px solid var(--border);white-space:nowrap;
}
td{padding:9px 11px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
img.qr-sm{width:52px;height:52px;background:#fff;border:1px solid var(--border);padding:3px;display:block}
img.qr-lg{width:152px;height:152px;background:#fff;border:1px solid #999;padding:6px;display:block}

/* Summary Strip (Registrar & Audit) */
.meta-strip{
  display:flex;gap:18px;flex-wrap:wrap;padding:10px 14px;margin-bottom:20px;
  background:var(--surface);border:1px solid var(--border);border-radius:2px;font-size:.84rem;
}
.meta-strip span{color:var(--mute)}
.meta-strip b{color:var(--ink);font-variant-numeric:tabular-nums}

/* Inline Feedback & File Trigger */
.inline-msg{font-size:.82rem;min-height:1.2em;margin-top:8px}
.inline-msg.ok{color:var(--ok);font-weight:600}
.inline-msg.err{color:var(--err);font-weight:600}
.file-btn{
  display:inline-block;padding:5px 10px;border:1px solid var(--border);border-radius:2px;
  background:var(--surface);color:var(--ink-2);font-size:.78rem;font-weight:600;cursor:pointer;
}
.file-btn:hover{border-color:var(--border-strong);color:var(--ink);background:var(--surface-2)}

/* Auth Box */
.auth-panel{max-width:440px;margin:24px auto}
.empty{padding:22px 14px;color:var(--mute);font-size:.88rem;text-align:center}

/* Official Printable Statement of Marks */
.sheet{
  background:#ffffff;color:#111111;border:1px solid #9aa0a6;padding:26px;
}
.sheet-inner{border:2px solid #111111;padding:24px}
.sheet-top{
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;
  padding-bottom:14px;margin-bottom:18px;border-bottom:2px solid #111111;
}
.sheet-top h2{margin:0;font:700 1.45rem/1.2 Georgia,"Times New Roman",serif;color:#111111}
.sheet-top p{margin:4px 0 0;font-size:.82rem;color:#444444}
.sheet-body{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start}
.sheet table{border:1px solid #cfd4da}
.sheet th{background:#f5f6f8;color:#333333;width:38%;border-bottom:1px solid #cfd4da}
.sheet td{background:#ffffff;color:#111111;border-bottom:1px solid #cfd4da}
.sheet-qr{text-align:center;border:1px solid #cfd4da;padding:12px;background:#fafafa}
.sheet-foot{
  margin-top:18px;padding-top:12px;border-top:1px solid #111111;
  font:400 .74rem/1.65 ui-monospace,Consolas,monospace;color:#333333;word-break:break-all;
}

/* Subtle Copy Notice */
#notice{
  position:fixed;right:18px;bottom:18px;z-index:50;
  padding:8px 13px;background:var(--ink);color:var(--bg);
  border-radius:2px;font-size:.8rem;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .18s ease;
}
#notice.show{opacity:1}

@media (max-width:780px){
  .split{grid-template-columns:1fr}
  .spec-grid{grid-template-columns:1fr 1fr}
  .spec-cell{border-bottom:1px solid var(--border)}
  .sheet-body{grid-template-columns:1fr}
  .sheet-qr{display:flex;flex-direction:column;align-items:center}
  .site-dept{display:none}
}
@media print{
  body{background:#fff!important;color:#000!important}
  .masthead,.noprint,#notice{display:none!important}
  main{max-width:none;padding:0;margin:0}
  .sheet{border:none;padding:0}
}
</style>
</head>
<body>
<header class="masthead noprint">
  <div class="masthead-inner">
    <a href="#verify" class="site-id">
      <span class="site-name">Result Ledger</span>
      <span class="site-dept">Examination Office · Verification Registry</span>
    </a>
    <div class="nav-wrap">
      <nav class="nav" aria-label="Main navigation">
        <a href="#verify" id="t-verify">Verify</a>
        <a href="#admin" id="t-admin">Registrar</a>
        <a href="#audit" id="t-audit">Audit Log</a>
      </nav>
      <button type="button" class="theme-toggle" id="themeBtn" aria-label="Toggle color theme">Dark</button>
    </div>
  </div>
</header>

<main id="app"></main>
<div id="notice" role="status" aria-live="polite"></div>

<script>
const $=s=>document.querySelector(s), app=$('#app'), enc=encodeURIComponent;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GENESIS='0'.repeat(64);
const hasSubtle=!!(globalThis.crypto&&crypto.subtle);

/* Theme */
function setTheme(t){
  document.documentElement.dataset.theme=t;
  localStorage.setItem('rl_theme',t);
  $('#themeBtn').textContent=t==='dark'?'Light':'Dark';
}
setTheme(localStorage.getItem('rl_theme')||'light');
$('#themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

let noticeTimer;
function notify(msg){
  const el=$('#notice');
  el.textContent=msg;el.className='show';
  clearTimeout(noticeTimer);
  noticeTimer=setTimeout(()=>{el.className='';},2400);
}
async function copyVal(v,label){
  try{await navigator.clipboard.writeText(v);notify(`${label} copied`);}
  catch{notify('Copy failed');}
}

/* Client-side crypto (matches lib/ledger.js) */
const sha=async b=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',b))].map(x=>x.toString(16).padStart(2,'0')).join('');
const shaStr=s=>sha(new TextEncoder().encode(s));
const hexB=h=>Uint8Array.from(h.match(/../g)||[],x=>parseInt(x,16));
const cat=(...a)=>{const o=new Uint8Array(a.reduce((n,x)=>n+x.length,0));let i=0;a.forEach(x=>{o.set(x,i);i+=x.length});return o};
const canon=r=>JSON.stringify(['v1',r.batch,r.student_id,r.course,Number(r.marks),r.version,r.supersedes||null,r.reason||'',r.approvals||[]]);
const leafOf=r=>sha(cat(Uint8Array.of(0),new TextEncoder().encode(canon(r))));
const headOf=c=>shaStr(JSON.stringify(['hdr',c.n,c.root,c.prev,c.count,c.ts]));
const corrDigestOf=r=>shaStr(JSON.stringify(['corr',r.student_id,r.course,Number(r.marks),r.reason,r.supersedes]));
async function rootOf(leaf,proof){
  let h=leaf;
  for(const s of proof){
    const a=hexB(s.hash),b=hexB(h);
    h=await sha(cat(Uint8Array.of(1),...(s.side==='L'?[a,b]:[b,a])));
  }
  return h;
}

const keyCache=new Map();
function pemToDer(pem){
  const b64=pem.replace(/-----[^-]+-----|\s+/g,'');
  return Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
}
async function verifyEd25519(pubPem,msgHex,sigHex){
  if(!hasSubtle)return null;
  try{
    let k=keyCache.get(pubPem);
    if(!k){
      k=await crypto.subtle.importKey('spki',pemToDer(pubPem),{name:'Ed25519'},false,['verify']);
      keyCache.set(pubPem,k);
    }
    return await crypto.subtle.verify('Ed25519',k,hexB(sigHex),hexB(msgHex));
  }catch{return null;}
}

const api=async(p,body,tok)=>{
  const r=await fetch(p,{method:body?'POST':'GET',headers:{'content-type':'application/json','x-token':tok||''},body:body&&JSON.stringify(body)});
  return{ok:r.ok,status:r.status,j:await r.json()};
};
const qrLink=r=>`${location.origin}/#verify?s=${enc(r.student_id)}&c=${enc(r.course)}&h=${r.leaf}`;
const sheetLink=r=>`#marksheet?s=${enc(r.student_id)}&c=${enc(r.course)}&h=${r.leaf}`;
const hashArgs=()=>new URLSearchParams(location.hash.split('?')[1]||'');

function route(){
  const v=(location.hash.slice(1).split('?')[0])||'verify';
  ['verify','admin','audit'].forEach(t=>$('#t-'+t).classList.toggle('on',t===v));
  ({verify,admin,audit,marksheet})[v]?.();
}
addEventListener('hashchange',route);addEventListener('load',route);

/* ---------------- VERIFY ---------------- */
function verify(){
  const q=hashArgs();
  app.innerHTML=`
    <div class="page-head">
      <div>
        <h1>Verify Examination Result</h1>
        <p>Checks the record's SHA-256 leaf digest, Merkle inclusion proof, batch hash chain, and Ed25519 signatures locally in your browser.</p>
      </div>
    </div>
    <div class="section noprint">
      <form class="row row-end" id="f">
        <label class="field">Student ID
          <input id="s" placeholder="e.g. REG101" value="${esc(q.get('s')||'')}" required>
        </label>
        <label class="field">Course Code (optional)
          <input id="c" placeholder="e.g. CSE101" value="${esc(q.get('c')||'')}">
        </label>
        <button type="submit">Verify</button>
        ${q.get('s')?'<button type="button" class="secondary" id="clr">Clear</button>':''}
      </form>
      ${q.get('h')?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:.8rem"><span style="font-weight:600;color:var(--ink-2)">QR Digest:</span> <span class="mono">${esc(q.get('h'))}</span></div>`:''}
    </div>
    <div id="out"></div>`;
  $('#f').onsubmit=e=>{
    e.preventDefault();
    const p=new URLSearchParams({s:$('#s').value.trim()});
    if($('#c').value.trim())p.set('c',$('#c').value.trim());
    location.hash='verify?'+p;
  };
  if($('#clr'))$('#clr').onclick=()=>{location.hash='verify';};
  if(q.get('s'))runVerify(q.get('s'),q.get('c'),q.get('h'));
  else $('#out').innerHTML=`<div class="section empty">Enter a Student ID above, or scan the QR code on an official marksheet to run verification.</div>`;
}

async function runVerify(s,c,h){
  const out=$('#out');
  if(!hasSubtle){
    out.innerHTML=`<div class="section"><div class="verdict err" style="margin:0"><div><div class="verdict-title">WebCrypto Unavailable</div><div class="verdict-sub">In-browser verification requires HTTPS or localhost.</div></div></div></div>`;
    return;
  }
  out.innerHTML='<div class="section empty">Verifying hashes, Merkle proof, and Ed25519 signatures…</div>';
  const [{j:res},{j:cp}]=await Promise.all([api(`/api/result?s=${enc(s)}${c?'&c='+enc(c):''}`),api('/api/checkpoints')]);
  if(!res.results?.length){
    out.innerHTML=`<div class="section"><div class="verdict err" style="margin:0"><div><div class="verdict-title">No Matching Record Found</div><div class="verdict-sub">No published result exists for student "${esc(s)}"${c?` in course "${esc(c)}"`:''}.</div></div></div></div>`;
    return;
  }

  const cpMap=new Map();
  let prev=GENESIS, chainBroken=false;
  for(const k of cp.checkpoints){
    const calcHead=await headOf(k);
    const sigOk=await verifyEd25519(cp.ledger_pub,k.head,k.sig);
    const linkOk=k.prev===prev && calcHead===k.head && !chainBroken;
    if(!linkOk || sigOk===false) chainBroken=true;
    cpMap.set(k.n,{cp:k,linkOk,sigOk});
    prev=k.head;
  }

  const blocks=[];
  for(const x of res.results){
    const leaf=await leafOf(x.record);
    const meta=cpMap.get(x.record.batch);
    const cpb=meta?.cp;
    const calcRoot=await rootOf(leaf,x.proof);
    const leafOk=leaf===x.leaf;
    const rootOk=!!cpb&&calcRoot===cpb.root;
    const chainOk=!!meta?.linkOk;
    const sigOk=meta?meta.sigOk:false;

    let corrOk=true, corrChecked=false;
    if(x.record.version>1){
      corrChecked=true;
      const d=await corrDigestOf(x.record);
      const validAdmins=new Set();
      let unsupported=false;
      for(const [aid,sig] of (x.record.approvals||[])){
        const pub=cp.admin_pubs?.[aid];
        if(!pub) continue;
        const ok=await verifyEd25519(pub,d,sig);
        if(ok===null){unsupported=true;break;}
        if(ok) validAdmins.add(aid);
      }
      corrOk=unsupported?null:validAdmins.size>=2;
    }

    const qrOk=h?h===leaf:null;
    const valid=leafOk&&rootOk&&chainOk&&sigOk!==false&&corrOk!==false&&qrOk!==false;
    const state=!valid?['err','VERIFICATION FAILED — RECORD INVALID','One or more cryptographic checks failed against the signed external checkpoint.']
      :x.superseded?['warn','AUTHENTIC HISTORICAL RECORD (SUPERSEDED)','Cryptographically valid, but replaced by a newer two-admin signed correction.']
      :['ok','AUTHENTIC — CURRENT RECORD','All cryptographic checks passed locally against the signed checkpoint chain.'];

    const line=(label,ok)=>{
      const cls=ok===null?'na':ok?'ok':'err';
      const code=ok===null?'[INFO]':ok?'[PASS]':'[FAIL]';
      return `<div class="check-row"><span class="check-code ${cls}">${code}</span><span>${label}${ok===null?' (browser Ed25519 unsupported; verified server-side)':''}</span></div>`;
    };

    blocks.push(`<div class="section">
      <div class="verdict ${state[0]}">
        <div>
          <div class="verdict-title">${state[1]}</div>
          <div class="verdict-sub">${state[2]}</div>
        </div>
        <a href="${sheetLink({student_id:x.record.student_id,course:x.record.course,leaf:x.leaf})}" class="noprint"><button type="button" class="secondary sm">Open Marksheet</button></a>
      </div>

      <div class="spec-grid">
        <div class="spec-cell"><div class="spec-k">Student ID</div><div class="spec-v num">${esc(x.record.student_id)}</div></div>
        <div class="spec-cell"><div class="spec-k">Course</div><div class="spec-v">${esc(x.record.course)}</div></div>
        <div class="spec-cell"><div class="spec-k">Marks</div><div class="spec-v num">${x.record.marks} / 100</div></div>
        <div class="spec-cell">
          <div class="spec-k">Version</div>
          <div class="spec-v num">v${x.record.version} <span class="tag ${x.superseded?'warn':'ok'}" style="margin-left:4px">${x.superseded?'Superseded':'Current'}</span></div>
          <div class="spec-sub">Batch #${x.batch.n} · ${new Date(x.batch.ts).toLocaleDateString()}</div>
        </div>
      </div>

      ${x.record.reason?`<div class="note-box">
        <b>Correction Record:</b> ${esc(x.record.reason)}<br>
        <span style="color:var(--mute)">Signed by <b>${x.record.approvals.map(a=>esc(a[0])).join('</b> and <b>')}</b> (Ed25519) · Supersedes <code>${esc((x.record.supersedes||'').slice(0,16))}…</code></span>
      </div>`:''}

      <div class="check-log">
        ${line('Canonical SHA-256 leaf digest matches stored record',leafOk)}
        ${line('Merkle inclusion proof reconstructs signed checkpoint root',rootOk)}
        ${line('Batch header and hash chain valid from genesis',chainOk)}
        ${line('Ledger Ed25519 signature verified in browser',sigOk)}
        ${corrChecked?line('Two distinct admin Ed25519 correction signatures verified',corrOk):''}
        ${h?line('Scanned QR digest matches this exact record',qrOk):''}
      </div>

      <details class="proof">
        <summary><span>Cryptographic Proof &amp; Merkle Path (${x.proof.length} step${x.proof.length===1?'':'s'})</span><span class="mono">SHA-256 / Ed25519</span></summary>
        <div class="proof-body">
          <table class="kv-table">
            <tr><th>Leaf Digest</th><td class="mono">${leaf}</td><td style="width:60px"><button type="button" class="link-btn" data-copy="${leaf}" data-label="Leaf digest">Copy</button></td></tr>
            <tr><th>Merkle Root</th><td class="mono">${calcRoot}</td><td><button type="button" class="link-btn" data-copy="${calcRoot}" data-label="Merkle root">Copy</button></td></tr>
            <tr><th>Batch Head</th><td class="mono">${x.batch.head}</td><td><button type="button" class="link-btn" data-copy="${x.batch.head}" data-label="Batch head">Copy</button></td></tr>
            <tr><th>Previous Head</th><td class="mono">${x.batch.prev}</td><td></td></tr>
          </table>
          ${x.proof.length?`<div class="merkle-list">
            <div class="spec-k" style="margin-bottom:4px">Merkle Sibling Path (Leaf to Root)</div>
            ${x.proof.map((st,i)=>`<div class="merkle-item"><span>${i+1}.</span><span class="tag neutral">${st.side==='L'?'L':'R'}</span><span>${st.hash}</span></div>`).join('')}
          </div>`:'<div class="mono" style="margin-top:8px">Single-leaf batch (leaf hash equals Merkle root).</div>'}
        </div>
      </details>
    </div>`);
  }

  const anyQr=h&&res.results.some(x=>x.leaf===h);
  out.innerHTML=(h&&!anyQr?`<div class="section"><div class="verdict err" style="margin:0"><div><div class="verdict-title">QR Digest Mismatch</div><div class="verdict-sub">The hash embedded in the QR code does not match any published record for this student.</div></div></div></div>`:'')+blocks.join('');
  out.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyVal(b.dataset.copy,b.dataset.label));
}

/* ---------------- PRINTABLE MARKSHEET ---------------- */
async function marksheet(){
  const q=hashArgs(), s=q.get('s')||'', c=q.get('c')||'', h=q.get('h')||'';
  if(!s){app.innerHTML=`<div class="section empty">Missing parameters. <a href="#verify">Return to verification</a>.</div>`;return;}
  app.innerHTML='<div class="section empty">Loading statement of marks…</div>';
  const {j:res}=await api(`/api/result?s=${enc(s)}${c?'&c='+enc(c):''}`);
  const match=(res.results||[]).find(x=>h?x.leaf===h:!x.superseded) || res.results?.[0];
  if(!match){app.innerHTML=`<div class="section"><div class="verdict err" style="margin:0"><div><div class="verdict-title">Record Not Found</div></div></div></div>`;return;}
  const r=match.record, link=qrLink({student_id:r.student_id,course:r.course,leaf:match.leaf});
  app.innerHTML=`
    <div class="between noprint" style="margin-bottom:16px">
      <button type="button" class="secondary" onclick="history.back()">← Back</button>
      <div class="row">
        <button type="button" class="secondary" id="copyUrl">Copy Verify URL</button>
        <a href="#verify?s=${enc(r.student_id)}&c=${enc(r.course)}&h=${match.leaf}"><button type="button" class="secondary">Open Verifier</button></a>
        <button type="button" onclick="window.print()">Print / Save PDF</button>
      </div>
    </div>
    <div class="sheet">
      <div class="sheet-inner">
        <div class="sheet-top">
          <div>
            <h2>Statement of Examination Marks</h2>
            <p>Issued via Signed Append-Only Examination Ledger</p>
          </div>
          <span class="tag ${match.superseded?'warn':'ok'}">${match.superseded?'Superseded':'Current Record'}</span>
        </div>
        <div class="sheet-body">
          <table>
            <tr><th>Student ID</th><td class="num"><b>${esc(r.student_id)}</b></td></tr>
            <tr><th>Course Code</th><td>${esc(r.course)}</td></tr>
            <tr><th>Marks Awarded</th><td class="num"><b>${r.marks}</b> / 100</td></tr>
            <tr><th>Ledger Version</th><td class="num">Version ${r.version} (Batch #${match.batch.n})</td></tr>
            <tr><th>Published At</th><td class="num">${new Date(match.batch.ts).toLocaleString()}</td></tr>
            ${r.reason?`<tr><th>Correction Reason</th><td>${esc(r.reason)}</td></tr>
            <tr><th>Authorizing Signers</th><td>${r.approvals.map(a=>esc(a[0])).join(', ')} (Ed25519)</td></tr>`:''}
          </table>
          <div class="sheet-qr">
            <img class="qr-lg" alt="Verification QR" src="/api/qr?text=${enc(link)}">
            <div style="font-size:.78rem;font-weight:700;color:#111;margin-top:8px">Scan to Verify</div>
            <div style="font-size:.7rem;color:#555">Independent browser check</div>
          </div>
        </div>
        <div class="sheet-foot">
          <b>Verify URL:</b> ${esc(link)}<br>
          <b>Leaf Hash:</b> ${match.leaf}<br>
          <b>Merkle Root:</b> ${match.batch.root}<br>
          <b>Batch Head:</b> ${match.batch.head}
        </div>
      </div>
    </div>`;
  $('#copyUrl').onclick=()=>copyVal(link,'Verification URL');
}

/* ---------------- REGISTRAR ---------------- */
function admin(){
  const tok=sessionStorage.tok||'';
  if(!tok){
    app.innerHTML=`
      <div class="section auth-panel">
        <div class="sec-head"><h2>Registrar Sign-In</h2><span class="mono">a1 / a2 / a3</span></div>
        <p class="sec-note">Enter an admin token to publish result batches or co-sign result corrections.</p>
        <form id="loginForm" style="display:flex;flex-direction:column;gap:12px">
          <label class="field">Admin Token
            <input id="tok" type="password" autocomplete="off" required>
          </label>
          <div class="row">
            <button type="submit">Sign In</button>
            <span id="loginErr" class="inline-msg err" style="margin:0"></span>
          </div>
        </form>
      </div>`;
    $('#tok').focus();
    $('#loginForm').onsubmit=async e=>{
      e.preventDefault();
      const t=$('#tok').value.trim();
      const {ok,j}=await api('/api/records',null,t);
      if(!ok){$('#loginErr').textContent=j.error||'Invalid token';return;}
      sessionStorage.tok=t;
      renderAdminPortal(j);
    };
    return;
  }
  loadAdminPortal();
}

async function loadAdminPortal(flash){
  const tok=sessionStorage.tok||'';
  const {ok,j}=await api('/api/records',null,tok);
  if(!ok){sessionStorage.removeItem('tok');admin();return;}
  renderAdminPortal(j,flash);
}

function renderAdminPortal(j,flash){
  const tok=sessionStorage.tok||'';
  const maxVer=new Map();
  let maxBatch=0;
  j.records.forEach(r=>{
    const k=r.student_id+'|'+r.course;
    maxVer.set(k,Math.max(maxVer.get(k)||0,r.version));
    if(r.batch>maxBatch) maxBatch=r.batch;
  });

  app.innerHTML=`
    <div class="page-head noprint">
      <div>
        <h1>Registrar Console</h1>
        <p>Publish signed exam batches and manage two-admin correction approvals.</p>
      </div>
      <div class="row">
        <span class="tag ok">Admin: ${esc(j.admin)}</span>
        <button type="button" class="secondary sm" id="switchBtn">Switch Admin</button>
      </div>
    </div>

    <div class="meta-strip noprint">
      <div><span>Records:</span> <b>${j.records.length}</b></div>
      <div><span>Signed Batches:</span> <b>${maxBatch}</b></div>
      <div><span>Pending Corrections:</span> <b>${j.pending.length}</b></div>
      <div><span>Active Key:</span> <b class="mono" style="color:var(--ink)">${esc(j.admin)}</b></div>
    </div>

    <div class="split noprint">
      <div class="section">
        <div class="sec-head">
          <h2>Publish Batch (CSV)</h2>
          <div class="row">
            <label class="file-btn">Import .csv<input type="file" id="csvFile" accept=".csv,text/csv,text/plain" hidden></label>
            <button type="button" class="link-btn" id="sampleBtn">Insert sample</button>
          </div>
        </div>
        <p class="sec-note">Columns: <code>student_id,course,marks</code> (marks 0–100, decimals allowed).</p>
        <textarea id="csv" placeholder="student_id,course,marks&#10;REG101,CSE101,84&#10;REG102,CSE101,91"></textarea>
        <div class="between" style="margin-top:10px">
          <button type="button" id="pub">Publish Batch</button>
          <span id="pubMsg" class="inline-msg ${flash?.area==='pub'?flash.cls:''}" style="margin:0">${flash?.area==='pub'?esc(flash.text):''}</span>
        </div>
      </div>

      <div class="section">
        <div class="sec-head"><h2>Propose Correction</h2><span class="mono">2-of-3 multi-sig</span></div>
        <p class="sec-note">Appends a new version linked to the prior leaf hash. Requires two distinct admin signatures.</p>
        <form id="propForm" style="display:flex;flex-direction:column;gap:10px">
          <div class="row">
            <label class="field">Student ID<input id="cs" placeholder="REG101" required></label>
            <label class="field">Course<input id="cc" placeholder="CSE101" required></label>
            <label class="field" style="max-width:115px">New Marks<input id="cm" type="number" step="any" min="0" max="100" required></label>
          </div>
          <label class="field">Reason (min 5 chars)
            <input id="cr" placeholder="Official re-evaluation approval" minlength="5" required>
          </label>
          <div class="between">
            <button type="submit">Submit Proposal</button>
            <span id="propMsg" class="inline-msg ${flash?.area==='prop'?flash.cls:''}" style="margin:0">${flash?.area==='prop'?esc(flash.text):''}</span>
          </div>
        </form>
      </div>
    </div>

    <div class="section noprint">
      <div class="sec-head">
        <h2>Pending Approvals</h2>
        <span id="pendMsg" class="inline-msg ${flash?.area==='pend'?flash.cls:''}" style="margin:0">${flash?.area==='pend'?esc(flash.text):`${j.pending.length} open`}</span>
      </div>
      ${j.pending.length?`<div class="table-wrap"><table>
        <thead><tr><th>ID</th><th>Student</th><th>Course</th><th>Marks</th><th>Reason</th><th>Signatures</th><th>Action</th></tr></thead>
        <tbody>${j.pending.map(p=>{
          const n=p.approvals.length, mine=p.approvals.includes(j.admin);
          return `<tr>
            <td class="num"><b>#${p.id}</b></td>
            <td class="num"><b>${esc(p.student_id)}</b></td>
            <td>${esc(p.course)}</td>
            <td class="num"><b>${p.marks}</b></td>
            <td>${esc(p.reason)}</td>
            <td><span class="tag ${n===1?'warn':'neutral'}">${n}/2</span> <span class="mono">${p.approvals.map(esc).join(', ')||'none'}</span></td>
            <td><button type="button" class="sm ${mine?'secondary':''}" data-ap="${p.id}">Sign &amp; Approve</button></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>`:'<div class="empty">No pending correction proposals.</div>'}
    </div>

    <div class="section">
      <div class="sec-head">
        <h2>Published Ledger Records</h2>
        <div class="row noprint">
          <input id="recFilter" placeholder="Filter student or course…" style="width:210px;padding:5px 9px;font-size:.82rem">
          <button type="button" class="secondary sm" onclick="window.print()">Print</button>
        </div>
      </div>
      ${j.records.length?`<div class="table-wrap"><table>
        <thead><tr><th>Batch</th><th>Student</th><th>Course</th><th>Marks</th><th>Version</th><th>QR</th><th class="noprint">Links</th></tr></thead>
        <tbody id="recBody">${renderRecordRows(j.records,maxVer)}</tbody>
      </table></div>`:'<div class="empty">No results published yet.</div>'}
    </div>`;

  $('#switchBtn').onclick=()=>{sessionStorage.removeItem('tok');admin();};
  $('#sampleBtn').onclick=()=>{
    const r=Math.floor(100+Math.random()*899);
    $('#csv').value=`student_id,course,marks\nREG${r}1,CSE101,78\nREG${r}2,CSE101,91\nREG${r}3,CSE101,64`;
  };
  $('#csvFile').onchange=e=>{
    const f=e.target.files?.[0];
    if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{$('#csv').value=String(rd.result||'');notify(`Loaded ${f.name}`);};
    rd.readAsText(f);
  };
  $('#pub').onclick=async()=>{
    const r=await api('/api/publish',{csv:$('#csv').value},tok);
    if(!r.ok){$('#pubMsg').className='inline-msg err';$('#pubMsg').textContent=r.j.error;return;}
    loadAdminPortal({area:'pub',cls:'ok',text:`Published batch #${r.j.n} (${r.j.count} rows)`});
  };
  $('#propForm').onsubmit=async e=>{
    e.preventDefault();
    const r=await api('/api/corrections',{student_id:$('#cs').value.trim(),course:$('#cc').value.trim(),marks:$('#cm').value,reason:$('#cr').value},tok);
    if(!r.ok){$('#propMsg').className='inline-msg err';$('#propMsg').textContent=r.j.error;return;}
    loadAdminPortal({area:'prop',cls:'ok',text:`Proposal #${r.j.id} created — requires 2 signatures`});
  };
  document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=async()=>{
    const r=await api(`/api/corrections/${b.dataset.ap}/approve`,{},tok);
    if(!r.ok){$('#pendMsg').className='inline-msg err';$('#pendMsg').textContent=r.j.error;return;}
    const msg=r.j.status==='published'?`Correction published in batch #${r.j.n}`:`Signed by ${j.admin} (1/2) — switch admin to complete`;
    loadAdminPortal({area:'pend',cls:'ok',text:msg});
  });
  if($('#recFilter'))$('#recFilter').oninput=e=>{
    const q=e.target.value.trim().toLowerCase();
    const filtered=q?j.records.filter(r=>r.student_id.toLowerCase().includes(q)||r.course.toLowerCase().includes(q)):j.records;
    $('#recBody').innerHTML=filtered.length?renderRecordRows(filtered,maxVer):'<tr><td colspan="7" class="empty">No matching records.</td></tr>';
  };
}

function renderRecordRows(records,maxVer){
  return records.slice().reverse().map(r=>{
    const old=r.version<maxVer.get(r.student_id+'|'+r.course);
    return `<tr>
      <td class="num">#${r.batch}</td>
      <td class="num"><b>${esc(r.student_id)}</b></td>
      <td>${esc(r.course)}</td>
      <td class="num"><b>${r.marks}</b></td>
      <td class="num">v${r.version} <span class="tag ${old?'warn':'ok'}" style="margin-left:4px">${old?'Superseded':'Current'}</span></td>
      <td><img class="qr-sm" loading="lazy" alt="QR" src="/api/qr?text=${enc(qrLink(r))}"></td>
      <td class="noprint"><a href="${sheetLink(r)}">Marksheet</a> · <a href="#verify?s=${enc(r.student_id)}&c=${enc(r.course)}&h=${r.leaf}">Verify</a></td>
    </tr>`;
  }).join('');
}

/* ---------------- AUDIT LOG ---------------- */
async function audit(){
  app.innerHTML=`
    <div class="page-head">
      <div>
        <h1>Database Integrity Audit</h1>
        <p>Recomputes every leaf hash, Merkle root, batch header, chain link, Ed25519 signature, and pending correction from SQLite against external checkpoints.</p>
      </div>
      <button type="button" id="go">Run Audit</button>
    </div>
    <div id="auditOut"></div>
    <div class="section">
      <div class="sec-head">
        <h2>Signed Checkpoint Log</h2>
        <span class="mono">External append-only anchor</span>
      </div>
      <div id="chainOut" class="empty">Loading checkpoints…</div>
    </div>`;

  const run=async()=>{
    $('#auditOut').innerHTML='<div class="section empty">Auditing SQLite records against external checkpoints…</div>';
    const [{j},{j:cp}]=await Promise.all([api('/api/audit'),api('/api/checkpoints')]);
    $('#auditOut').innerHTML=`
      <div class="meta-strip">
        <div><span>Status:</span> <b style="color:${j.ok?'var(--ok)':'var(--err)'}">${j.ok?'INTACT':'TAMPERED'}</b></div>
        <div><span>Batches:</span> <b>${j.batches}</b></div>
        <div><span>Records:</span> <b>${j.records}</b></div>
        <div><span>Violations:</span> <b style="color:${j.issues.length?'var(--err)':'var(--ok)'}">${j.issues.length}</b></div>
        <div><span>Checked:</span> <b>${new Date(j.checked_at).toLocaleTimeString()}</b></div>
      </div>
      <div class="section">
        <div class="verdict ${j.ok?'ok':'err'}" style="margin-bottom:${j.issues.length?14:0}px">
          <div>
            <div class="verdict-title">${j.ok?'LEDGER INTACT — ZERO TAMPERING DETECTED':`TAMPERING DETECTED — ${j.issues.length} VIOLATION${j.issues.length>1?'S':''} FOUND`}</div>
            <div class="verdict-sub">${j.ok?'All SQLite records, batch Merkle roots, signatures, and pending proposals match the external signed checkpoints.':'Direct out-of-band modifications were detected in SQLite and pinpointed below.'}</div>
          </div>
        </div>
        ${j.issues.length?`<div class="table-wrap"><table>
          <thead><tr><th>Scope</th><th>Target</th><th>Detected Violation</th></tr></thead>
          <tbody>${j.issues.map(i=>`<tr>
            <td><span class="tag err">${i.batch===0?'Pending':'Batch #'+i.batch}</span></td>
            <td>${i.student?`<b>${esc(i.student)}</b> / ${esc(i.course)}`:'Batch Header'}${i.idx!==undefined?` <span class="mono">(idx ${i.idx})</span>`:''}</td>
            <td style="color:var(--err);font-weight:600">${esc(i.problem)}</td>
          </tr>`).join('')}</tbody>
        </table></div>`:''}
      </div>`;

    if(!cp.checkpoints?.length){
      $('#chainOut').innerHTML='<div class="empty">No checkpoints published yet.</div>';
    }else{
      $('#chainOut').innerHTML=`<div class="table-wrap"><table>
        <thead><tr><th>Batch</th><th>Leaves</th><th>Published</th><th>Merkle Root</th><th>Signed Head</th><th>Prev Head</th></tr></thead>
        <tbody>${cp.checkpoints.slice().reverse().map(c=>`<tr>
          <td class="num"><b>#${c.n}</b></td>
          <td class="num">${c.count}</td>
          <td class="num" style="white-space:nowrap">${new Date(c.ts).toLocaleString()}</td>
          <td class="mono">${c.root.slice(0,18)}…</td>
          <td class="mono">${c.head.slice(0,18)}…</td>
          <td class="mono">${c.prev===GENESIS?'GENESIS':c.prev.slice(0,18)+'…'}</td>
        </tr>`).join('')}</tbody>
      </table></div>`;
    }
  };
  $('#go').onclick=run;
  run();
}
