<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ResultLedger — Cryptographic Examination Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafafa;
  --surface:#ffffff;
  --surface-2:#f4f4f5;
  --surface-3:#ececef;
  --ink:#09090b;
  --ink-2:#3f3f46;
  --mute:#71717a;
  --line:#e4e4e7;
  --line-2:#d4d4d8;
  --btn-bg:#18181b;
  --btn-ink:#ffffff;
  --btn-hover:#27272a;
  --accent:#2563eb;
  --ok:#059669;
  --ok-bg:#ecfdf5;
  --ok-line:#a7f3d0;
  --warn:#b45309;
  --warn-bg:#fffbeb;
  --warn-line:#fde68a;
  --err:#dc2626;
  --err-bg:#fef2f2;
  --err-line:#fecaca;
  --shadow-xs:0 1px 2px rgba(9,9,11,.04);
  --shadow-md:0 8px 24px rgba(9,9,11,.08),0 1px 3px rgba(9,9,11,.05);
  --sidebar-w:248px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#09090b;
  --surface:#111113;
  --surface-2:#18181b;
  --surface-3:#222226;
  --ink:#fafafa;
  --ink-2:#d4d4d8;
  --mute:#8e8e98;
  --line:#242429;
  --line-2:#34343c;
  --btn-bg:#fafafa;
  --btn-ink:#09090b;
  --btn-hover:#e4e4e7;
  --accent:#60a5fa;
  --ok:#34d399;
  --ok-bg:rgba(16,185,129,.1);
  --ok-line:rgba(16,185,129,.28);
  --warn:#fbbf24;
  --warn-bg:rgba(245,158,11,.1);
  --warn-line:rgba(245,158,11,.28);
  --err:#f87171;
  --err-bg:rgba(239,68,68,.1);
  --err-line:rgba(239,68,68,.28);
  --shadow-xs:0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 12px 32px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font:14px/1.5 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
code,.mono{
  font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-variant-numeric:tabular-nums;
}
.mono{font-size:12px;color:var(--mute);word-break:break-all}
.num{font-variant-numeric:tabular-nums}

/* App Shell */
.shell{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  position:fixed;top:0;bottom:0;left:0;z-index:40;
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  transition:transform .2s ease;
}
.sb-head{
  height:56px;padding:0 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
}
.sb-logo{
  width:28px;height:28px;border-radius:6px;background:var(--ink);color:var(--bg);
  display:grid;place-items:center;flex-shrink:0;
}
.sb-brand{font-weight:700;font-size:14px;letter-spacing:-.02em;line-height:1.1}
.sb-ver{font-size:11px;color:var(--mute);display:block;font-family:"JetBrains Mono",monospace}

.sb-nav{flex:1;overflow-y:auto;padding:14px 10px}
.sb-group{margin-bottom:18px}
.sb-label{
  padding:0 10px 6px;font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.06em;color:var(--mute);
}
.sb-link{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;
  font-size:13.5px;font-weight:500;color:var(--ink-2);margin-bottom:2px;
  transition:background .12s ease,color .12s ease;
}
.sb-link svg{width:16px;height:16px;color:var(--mute);flex-shrink:0}
.sb-link:hover{background:var(--surface-2);color:var(--ink)}
.sb-link.on{background:var(--surface-2);color:var(--ink);font-weight:600}
.sb-link.on svg{color:var(--ink)}
.sb-pill{
  margin-left:auto;font:600 11px/1 "JetBrains Mono",monospace;
  padding:2px 6px;border-radius:99px;background:var(--surface-3);color:var(--ink-2);
}

.sb-foot{
  padding:12px 16px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:10px;background:var(--surface);
}
.node-status{
  display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex-shrink:0}
.dot.err{background:var(--err)}
.sb-foot-row{display:flex;align-items:center;justify-content:space-between;gap:8px}

/* Mobile Header */
.mob-bar{
  display:none;position:sticky;top:0;z-index:35;height:52px;padding:0 14px;
  background:var(--surface);border-bottom:1px solid var(--line);
  align-items:center;justify-content:space-between;gap:10px;
}
.backdrop{
  display:none;position:fixed;inset:0;z-index:38;background:rgba(0,0,0,.45);
}
.backdrop.open{display:block}

/* Main Workspace */
.workspace{
  flex:1;margin-left:var(--sidebar-w);min-width:0;display:flex;flex-direction:column;
}
.topbar{
  height:56px;padding:0 28px;border-bottom:1px solid var(--line);
  background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:16px;
  position:sticky;top:0;z-index:20;
}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.crumb b{color:var(--ink);font-weight:600}
.content{max-width:1160px;width:100%;margin:0 auto;padding:28px 28px 64px}

/* Typography & Headers */
.page-head{
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;
  margin-bottom:22px;
}
.page-head h1{margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.page-head p{margin:0;font-size:13.5px;color:var(--mute);max-width:66ch}

/* Surfaces & Grids */
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
  box-shadow:var(--shadow-xs);margin-bottom:18px;overflow:hidden;
}
.panel-head{
  padding:14px 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.panel-title{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
.panel-sub{font-size:12.5px;color:var(--mute);margin-top:2px}
.panel-body{padding:18px}

.verify-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* Metric Strip */
.stat-strip{
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
  box-shadow:var(--shadow-xs);margin-bottom:18px;overflow:hidden;
}
.stat-cell{padding:14px 18px;border-right:1px solid var(--line)}
.stat-cell:last-child{border-right:none}
.stat-k{font-size:11.5px;font-weight:500;color:var(--mute);margin-bottom:4px}
.stat-v{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat-s{font-size:11.5px;color:var(--mute);margin-top:2px}

/* Controls */
label.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;color:var(--ink-2);flex:1;min-width:140px}
input,textarea,select,button{font:inherit}
input,textarea,select{
  height:36px;padding:0 11px;border:1px solid var(--line-2);border-radius:6px;
  background:var(--surface);color:var(--ink);width:100%;font-size:13.5px;
  transition:border-color .12s ease,box-shadow .12s ease;
}
textarea{height:auto;min-height:132px;padding:10px 12px;font-family:"JetBrains Mono",monospace;font-size:12.5px;line-height:1.55;resize:vertical}
input:focus,textarea:focus,select:focus{
  outline:none;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 10%,transparent);
}
button{
  height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--btn-bg);
  background:var(--btn-bg);color:var(--btn-ink);font-size:13px;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  white-space:nowrap;transition:background .12s ease,border-color .12s ease;
}
button:hover{background:var(--btn-hover);border-color:var(--btn-hover)}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
button.ghost:hover{background:var(--surface-2);border-color:var(--ink-2)}
button.subtle{background:var(--surface-2);color:var(--ink-2);border-color:transparent}
button.subtle:hover{background:var(--surface-3);color:var(--ink)}
button.sm{height:30px;padding:0 10px;font-size:12px;border-radius:5px}
button.xs{height:24px;padding:0 8px;font-size:11.5px;border-radius:4px}
button.icon-btn{width:32px;height:32px;padding:0}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row-end{align-items:flex-end}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* Segmented Tabs inside Views */
.tabs{
  display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap;
}
.tab{
  height:auto;padding:9px 14px;border:none;border-bottom:2px solid transparent;border-radius:0;
  background:transparent;color:var(--mute);font-size:13.5px;font-weight:500;margin-bottom:-1px;
}
.tab:hover{background:transparent;color:var(--ink);border-color:transparent}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}

/* Badges & Status Banners */
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:5px;
  font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap;
}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.badge.err{background:var(--err-bg);color:var(--err);border-color:var(--err-line)}
.badge.neutral{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}

.status-bar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:14px 18px;border-radius:8px;border:1px solid var(--line);margin-bottom:18px;
}
.status-bar.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.status-bar.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.status-bar.err{background:var(--err-bg);border-color:var(--err-line)}
.status-lead{display:flex;align-items:flex-start;gap:11px}
.status-ico{
  width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  flex-shrink:0;margin-top:1px;font-size:12px;font-weight:700;
}
.status-bar.ok .status-ico{background:var(--ok);color:#fff}
.status-bar.warn .status-ico{background:var(--warn);color:#fff}
.status-bar.err .status-ico{background:var(--err);color:#fff}
.status-title{font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.status-bar.ok .status-title{color:var(--ok)}
.status-bar.warn .status-title{color:var(--warn)}
.status-bar.err .status-title{color:var(--err)}
.status-desc{font-size:12.5px;color:var(--ink-2);margin-top:2px}

/* Verification Matrix & Interactive Merkle Tree */
.check-list{display:flex;flex-direction:column}
.check-item{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 18px;border-bottom:1px solid var(--line);font-size:13px;
}
.check-item:last-child{border-bottom:none}
.check-left{display:flex;align-items:center;gap:10px}
.check-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.check-dot.ok{background:var(--ok)}
.check-dot.err{background:var(--err)}
.check-dot.na{background:var(--warn)}

.merkle-flow{display:flex;flex-direction:column;gap:8px}
.m-node{
  padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);
  display:flex;flex-direction:column;gap:4px;
}
.m-node.root{border-color:var(--ok-line);background:var(--ok-bg)}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.m-arrow{padding-left:14px;font:500 11px/1 "JetBrains Mono",monospace;color:var(--mute)}

/* Tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;padding:10px 16px;font-size:11.5px;font-weight:600;
  color:var(--mute);background:var(--surface-2);border-bottom:1px solid var(--line);
  white-space:nowrap;
}
td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:color-mix(in srgb,var(--surface-2) 65%,transparent)}
img.qr-sm{width:44px;height:44px;background:#fff;border:1px solid var(--line);padding:3px;border-radius:4px;display:block}
img.qr-card{width:168px;height:168px;background:#fff;border:1px solid var(--line);padding:8px;border-radius:6px;display:block;margin:0 auto}

/* Dropzone & Multi-Sig Slots */
.dropzone{
  display:block;
  border:1.5px dashed var(--line-2);border-radius:8px;padding:18px;text-align:center;
  background:var(--surface-2);cursor:pointer;margin-bottom:12px;transition:border-color .15s ease;
}
.dropzone:hover,.dropzone.drag{border-color:var(--ink)}
.sig-slots{display:flex;gap:6px;align-items:center}
.sig-slot{
  padding:3px 8px;border-radius:4px;font:600 11px/1.3 "JetBrains Mono",monospace;
  border:1px dashed var(--line-2);color:var(--mute);
}
.sig-slot.filled{border-style:solid;border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok)}

/* Key Block */
.pem-box{
  margin:0;padding:12px 14px;border-radius:6px;background:var(--surface-2);
  border:1px solid var(--line);font:400 11.5px/1.55 "JetBrains Mono",monospace;
  color:var(--ink-2);overflow-x:auto;white-space:pre;
}

/* Modal */
.modal-bg{
  position:fixed;inset:0;z-index:60;background:rgba(9,9,11,.55);
  display:grid;place-items:center;padding:16px;
}
.modal{
  width:100%;max-width:480px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow-md);overflow:hidden;
}

/* Printable Official Certificate */
.sheet-wrap{max-width:820px;margin:0 auto}
.sheet{
  background:#ffffff;color:#09090b;border:1px solid #d4d4d8;border-radius:6px;
  padding:30px;box-shadow:var(--shadow-md);
}
.sheet-border{border:1.5px solid #09090b;padding:26px}
.sheet-head{
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;
  padding-bottom:16px;margin-bottom:20px;border-bottom:1.5px solid #09090b;
}
.sheet-h1{margin:0;font:700 22px/1.2 Georgia,"Times New Roman",serif;color:#09090b}
.sheet-sub{font-size:12.5px;color:#52525b;margin-top:3px}
.sheet-grid{display:grid;grid-template-columns:1fr 190px;gap:24px;align-items:start}
.sheet table{border:1px solid #e4e4e7}
.sheet th{background:#f4f4f5;color:#52525b;width:38%;padding:9px 12px;border-bottom:1px solid #e4e4e7}
.sheet td{background:#fff;color:#09090b;padding:9px 12px;border-bottom:1px solid #e4e4e7}
.sheet-qr-box{text-align:center;border:1px solid #e4e4e7;padding:12px;border-radius:4px;background:#fafafa}
.sheet-seal{
  margin-top:20px;padding-top:14px;border-top:1px dashed #a1a1aa;
  font:400 11px/1.65 "JetBrains Mono",monospace;color:#3f3f46;word-break:break-all;
}

/* Toast */
#toast{
  position:fixed;right:20px;bottom:20px;z-index:80;max-width:360px;
  padding:10px 14px;border-radius:7px;font-size:13px;font-weight:500;
  background:var(--ink);color:var(--bg);box-shadow:var(--shadow-md);
  transform:translateY(120%);opacity:0;transition:all .18s ease;pointer-events:none;
}
#toast.show{transform:translateY(0);opacity:1}
#toast.err{background:var(--err);color:#fff}

.empty{padding:36px 20px;text-align:center;color:var(--mute);font-size:13.5px}

@media (max-width:940px){
  .verify-grid,.grid-2{grid-template-columns:1fr}
  .stat-strip{grid-template-columns:1fr 1fr}
  .stat-cell{border-bottom:1px solid var(--line)}
}
@media (max-width:820px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .workspace{margin-left:0}
  .mob-bar{display:flex}
  .topbar{display:none}
  .content{padding:18px 14px 48px}
  .sheet-grid{grid-template-columns:1fr}
}
@media print{
  body{background:#fff!important;color:#000!important}
  .sidebar,.mob-bar,.topbar,.noprint,#toast,#modalHost{display:none!important}
  .workspace{margin-left:0!important}
  .content{max-width:none;padding:0;margin:0}
  .sheet{box-shadow:none;border:none;padding:0}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar noprint" id="sidebar" aria-label="Primary Navigation">
    <div class="sb-head">
      <div class="sb-logo" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L3 7v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V7l-9-5z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
      <div>
        <div class="sb-brand">ResultLedger</div>
        <span class="sb-ver">Ed25519 · Merkle v1</span>
      </div>
    </div>

    <nav class="sb-nav">
      <div class="sb-group">
        <div class="sb-label">Verification</div>
        <a href="#verify" class="sb-link" data-nav="verify">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          Verify Credential
        </a>
        <a href="#explorer" class="sb-link" data-nav="explorer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          Ledger Explorer
          <span class="sb-pill" id="sbBatches">0</span>
        </a>
        <a href="#keys" class="sb-link" data-nav="keys">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
          Trust Anchors
        </a>
      </div>

      <div class="sb-group">
        <div class="sb-label">Operations</div>
        <a href="#admin" class="sb-link" data-nav="admin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Registrar Console
        </a>
        <a href="#audit" class="sb-link" data-nav="audit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Integrity Audit
        </a>
      </div>
    </nav>

    <div class="sb-foot">
      <div class="node-status">
        <span class="dot" id="nodeDot"></span>
        <span id="nodeText">Connecting to ledger…</span>
      </div>
      <div class="sb-foot-row">
        <span class="mono" style="font-size:11px" id="cryptoMode">WebCrypto</span>
        <button type="button" class="ghost xs" id="themeBtn">Dark Mode</button>
      </div>
    </div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <div class="workspace">
    <div class="mob-bar noprint">

<script>
const $=s=>document.querySelector(s), app=$('#app'), enc=encodeURIComponent;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GENESIS='0'.repeat(64);
const hasSubtle=!!(globalThis.crypto&&crypto.subtle);
let adminTab='records', verifyTab='single';
let pinnedKeys={ledger_pub:'',admin_pubs:{}};

/* Theme & Drawer */
function setTheme(t){

/* Toast, Copy & Download */
let toastT;
function toast(msg,isErr=false){
  const el=$('#toast');
  el.textContent=msg;el.className=`show${isErr?' err':''}`;
  clearTimeout(toastT);
  toastT=setTimeout(()=>{el.className='';},3000);
}
async function copyVal(val,label='Value'){

  catch{toast('Clipboard unavailable',true);}

function downloadJson(filename,obj){

}

/* Client-Side Cryptographic Engine (Exact parity with lib/ledger.js) */
const sha=async b=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',b))].map(x=>x.toString(16).padStart(2,'0')).join('');
const shaStr=s=>sha(new TextEncoder().encode(s));
const hexB=h=>Uint8Array.from(h.match(/../g)||[],x=>parseInt(x,16));
const cat=(...a)=>{const o=new Uint8Array(a.reduce((n,x)=>n+x.length,0));let i=0;a.forEach(x=>{o.set(x,i);i+=x.length});return o};
const canon=r=>JSON.stringify(['v1',r.batch,r.student_id,r.course,Number(r.marks),r.version,r.supersedes||null,r.reason||'',r.approvals||[]]);
const leafOf=r=>sha(cat(Uint8Array.of(0),new TextEncoder().encode(canon(r))));
const headOf=c=>shaStr(JSON.stringify(['hdr',c.n,c.root,c.prev,c.count,c.ts]));
const corrDigestOf=r=>shaStr(JSON.stringify(['corr',r.student_id,r.course,Number(r.marks),r.reason,r.supersedes]));

async function traceMerkle(leaf,proof){
  const steps=[];
  let cur=leaf;
  for(let i=0;i<proof.length;i++){
    const s=proof[i];
    const a=hexB(s.hash),b=hexB(cur);
    const next=await sha(cat(Uint8Array.of(1),...(s.side==='L'?[a,b]:[b,a])));
    steps.push({level:i+1,side:s.side,sibling:s.hash,result:next});
    cur=next;
  }
  return {root:cur,steps};
}

const keyCache=new Map();
function pemToDer(pem){
  const b64=pem.replace(/-----[^-]+-----|\s+/g,'');
  return Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
}
async function verifyEd25519(pubPem,msgHex,sigHex){
  if(!hasSubtle||!pubPem||!msgHex||!sigHex)return null;
  try{
    let k=keyCache.get(pubPem);
    if(!k){
      k=await crypto.subtle.importKey('spki',pemToDer(pubPem),{name:'Ed25519'},false,['verify']);
      keyCache.set(pubPem,k);
    }
    return await crypto.subtle.verify('Ed25519',k,hexB(sigHex),hexB(msgHex));
  }catch{return false;}
}

/* API & Helpers */
const api=async(p,body,tok)=>{
  const r=await fetch(p,{method:body?'POST':'GET',headers:{'content-type':'application/json','x-token':tok||''},body:body&&JSON.stringify(body)});
  return{ok:r.ok,status:r.status,j:await r.json()};
};
const qrLink=r=>`${location.origin}/#verify?s=${enc(r.student_id)}&c=${enc(r.course)}&h=${r.leaf}`;
const sheetLink=r=>`#marksheet?s=${enc(r.student_id)}&c=${enc(r.course)}&h=${r.leaf}`;
const hashArgs=()=>new URLSearchParams(location.hash.split('?')[1]||'');

async function refreshNodeStatus(){

    const {ok,j}=await api('/api/checkpoints');

    if(j.ledger_pub){
      pinnedKeys={ledger_pub:j.ledger_pub,admin_pubs:j.admin_pubs||{}};

    $('#nodeText').textContent=n?`${n} signed batch${n===1?'':'es'} live`:'Ledger ready (genesis)';
  }catch{
    try{const saved=JSON.parse(localStorage.getItem('rl_pinned_keys')||'{}');if(saved.ledger_pub)pinnedKeys=saved;}catch{}
    $('#nodeDot').className='dot err';
    $('#nodeText').textContent='Offline mode (cached keys)';
  }
}

/* Router */
const TITLES={

          </label>
          <label class="field">Course Code (optional)
            <input id="vc" placeholder="e.g. CSE101" value="${esc(q.get('c')||'')}">
          </label>
          <button type="submit">Verify Record</button>
          ${q.get('s')?'<button type="button" class="ghost" id="vclr">Reset</button>':''}
        </form>
        ${q.get('h')?`<div class="row" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
          <span class="badge neutral">QR Bound Digest</span>
          <span class="mono">${esc(q.get('h'))}</span>

      </div>
    </div>
    <div id="vout"></div>`;

  $('#vf').onsubmit=e=>{

/* --- TAB 2: EMPLOYER BULK VERIFICATION --- */
function renderBulkVerify(){
  $('#vBody').innerHTML=`
    <div class="panel noprint">
      <div class="panel-head">
        <div>
          <h2 class="panel-title">Employer / Admissions Bulk Verification</h2>
          <div class="panel-sub">Upload or paste applicant claims (<code>student_id,course,claimed_marks</code>) to detect forged or inflated resumes in parallel.</div>
        </div>
        <button type="button" class="subtle sm" id="bSample">Load Sample Claims</button>
      </div>
      <div class="panel-body">
        <label class="dropzone" id="bdz">
          <div style="font-weight:600;font-size:13px">Drop an applicant .CSV file here, or click to browse</div>
          <div style="font-size:12px;color:var(--mute);margin-top:3px">Each row is independently verified via WebCrypto Merkle + Ed25519 proofs</div>
          <input type="file" id="bFile" accept=".csv,text/csv,text/plain" hidden>
        </label>
        <textarea id="bCsv" placeholder="student_id,course,claimed_marks&#10;1,CSE205,89&#10;2,CSE202,99"></textarea>
        <div class="between" style="margin-top:12px">
          <span class="mono">claimed_marks is optional — include it to flag resume inflation</span>
          <button type="button" id="bRun">Verify All Credentials</button>
        </div>
      </div>
    </div>
    <div id="bOut"></div>`;

  $('#bSample').onclick=()=>{
    $('#bCsv').value=`student_id,course,claimed_marks\n1,CSE205,89\n2,CSE202,99\nREG999,CSE101,85`;
    toast('Loaded sample applicant claims');
  };
  const readF=f=>{
    if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{$('#bCsv').value=String(rd.result||'');toast(`Loaded ${f.name}`);};
    rd.readAsText(f);
  };
  $('#bFile').onchange=e=>readF(e.target.files?.[0]);
  const dz=$('#bdz');
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag');};
  dz.ondragleave=()=>dz.classList.remove('drag');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('drag');readF(e.dataTransfer.files?.[0]);};

  $('#bRun').onclick=async()=>{
    const lines=$('#bCsv').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    const reqs=[];
    lines.forEach((line,i)=>{
      if(i===0 && /^student_id\s*,/i.test(line))return;
      const [s,c,mRaw]=line.split(',').map(x=>(x||'').trim());
      if(!s)return;
      const hasClaim=mRaw!==undefined&&mRaw!=='';
      reqs.push({student_id:s,course:c||'',claimed:hasClaim?Number(mRaw):null,rawClaim:mRaw||''});
    });
    if(!reqs.length)return toast('Paste at least one student row first',true);
    if(!hasSubtle)return toast('WebCrypto requires HTTPS or localhost',true);

    $('#bOut').innerHTML='<div class="panel"><div class="empty">Verifying Merkle proofs &amp; Ed25519 signatures across all applicants…</div></div>';
    const t0=performance.now();
    const {j:cp}=await api('/api/checkpoints');
    const cpMap=new Map();
    let prev=GENESIS, chainBroken=false;
    for(const k of (cp.checkpoints||[])){
      const calcHead=await headOf(k);
      const sigOk=await verifyEd25519(cp.ledger_pub,k.head,k.sig);
      const linkOk=k.prev===prev&&calcHead===k.head&&!chainBroken;
      if(!linkOk||sigOk===false)chainBroken=true;
      cpMap.set(k.n,{cp:k,linkOk,sigOk});
      prev=k.head;
    }

    const rows=await Promise.all(reqs.map(async req=>{
      const {j:res}=await api(`/api/result?s=${enc(req.student_id)}${req.course?'&c='+enc(req.course):''}`);
      if(!res.results?.length)return {...req,status:'not_found',detail:'No published record in ledger'};
      const x=res.results.find(r=>!r.superseded)||res.results[0];
      const leaf=await leafOf(x.record);
      const meta=cpMap.get(x.record.batch);
      const {root:calcRoot}=await traceMerkle(leaf,x.proof);
      let corrOk=true;
      if(x.record.version>1){
        const d=await corrDigestOf(x.record);
        const validAdmins=new Set();
        for(const [aid,sig] of (x.record.approvals||[])){
          const pub=cp.admin_pubs?.[aid];
          if(pub && await verifyEd25519(pub,d,sig)===true) validAdmins.add(aid);
        }
        corrOk=validAdmins.size>=2;
      }
      const valid=leaf===x.leaf&&!!meta?.cp&&calcRoot===meta.cp.root&&!!meta?.linkOk&&meta.sigOk!==false&&corrOk;
      if(!valid)return {...req,actual:x.record.marks,course:x.record.course,ver:x.record.version,batch:x.batch.n,status:'tampered',detail:'Cryptographic proof failed'};
      if(req.claimed!==null && (Number.isNaN(req.claimed)||Number(req.claimed)!==Number(x.record.marks))){
        return {...req,actual:x.record.marks,course:x.record.course,ver:x.record.version,batch:x.batch.n,status:'mismatch',detail:`Claimed ${req.rawClaim}, ledger verified ${x.record.marks}`};
      }
      return {...req,actual:x.record.marks,course:x.record.course,ver:x.record.version,batch:x.batch.n,status:'verified',detail:`Batch #${x.batch.n} · v${x.record.version} · Ed25519 OK`};
    }));
    const ms=(performance.now()-t0).toFixed(1);

    const cOk=rows.filter(r=>r.status==='verified').length;
    const cFraud=rows.filter(r=>r.status==='mismatch'||r.status==='tampered').length;
    const cMiss=rows.filter(r=>r.status==='not_found').length;

    const badgeOf=st=>st==='verified'?'<span class="badge ok">Verified</span>'
      :st==='mismatch'?'<span class="badge err">Marks Mismatch</span>'
      :st==='tampered'?'<span class="badge err">Tampered</span>'
      :'<span class="badge warn">Not Found</span>';

    $('#bOut').innerHTML=`
      <div class="stat-strip">
        <div class="stat-cell"><div class="stat-k">Applicants Checked</div><div class="stat-v">${rows.length}</div><div class="stat-s">Completed in ${ms} ms</div></div>
        <div class="stat-cell"><div class="stat-k">Cryptographically Verified</div><div class="stat-v" style="color:var(--ok)">${cOk}</div><div class="stat-s">Matches signed ledger</div></div>
        <div class="stat-cell"><div class="stat-k">Fraud / Mismatches</div><div class="stat-v" style="color:${cFraud?'var(--err)':'var(--ink)'}">${cFraud}</div><div class="stat-s">Inflated or tampered</div></div>
        <div class="stat-cell"><div class="stat-k">Not Found</div><div class="stat-v" style="color:${cMiss?'var(--warn)':'var(--ink)'}">${cMiss}</div><div class="stat-s">Unregistered records</div></div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <h2 class="panel-title">Bulk Verification Results</h2>
          <button type="button" class="ghost sm" id="bExport">Export Report JSON</button>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>Student ID</th><th>Course</th><th>Claimed</th><th>Ledger Verified</th><th>Verdict</th><th>Details</th><th></th></tr></thead>
          <tbody>${rows.map(r=>`<tr>
            <td class="num"><b>${esc(r.student_id)}</b></td>
            <td>${esc(r.course||'—')}</td>
            <td class="num">${r.rawClaim||'—'}</td>
            <td class="num"><b>${r.actual!==undefined?r.actual:'—'}</b></td>
            <td>${badgeOf(r.status)}</td>
            <td style="font-size:12.5px;color:${r.status==='mismatch'||r.status==='tampered'?'var(--err)':'var(--mute)'}">${esc(r.detail)}</td>
            <td style="text-align:right">${r.actual!==undefined?`<a href="#verify?s=${enc(r.student_id)}&c=${enc(r.course)}"><button type="button" class="subtle xs">Inspect</button></a>`:''}</td>
          </tr>`).join('')}</tbody>
        </table></div>
      </div>`;

    $('#bExport').onclick=()=>{
      downloadJson(`bulk-verification-${Date.now()}.json`,{verified_at:new Date().toISOString(),elapsed_ms:Number(ms),summary:{total:rows.length,verified:cOk,fraud_or_mismatch:cFraud,not_found:cMiss},results:rows});
      toast('Bulk verification report downloaded');
    };
  };
}

/* --- TAB 3: ZERO-SERVER OFFLINE PROOF VERIFIER --- */
function renderOfflineVerify(){
  if(!pinnedKeys.ledger_pub){
    try{const s=JSON.parse(localStorage.getItem('rl_pinned_keys')||'{}');if(s.ledger_pub)pinnedKeys=s;}catch{}
  }
  $('#vBody').innerHTML=`
    <div class="panel noprint">
      <div class="panel-head">
        <div>
          <h2 class="panel-title">Zero-Server Offline Proof Verifier</h2>
          <div class="panel-sub">Verifies a portable <code>proof-*.json</code> bundle purely in your browser using the pinned Ed25519 root key — zero database calls required.</div>
        </div>
        <span class="badge ${pinnedKeys.ledger_pub?'ok':'warn'}">${pinnedKeys.ledger_pub?'Root Key Pinned':'Paste Root Key Below'}</span>
      </div>
      <div class="panel-body">
        <label class="dropzone" id="odz">
          <div style="font-weight:600;font-size:13px">Drop an exported Proof Bundle (.json) here, or click to browse</div>
          <div style="font-size:12px;color:var(--mute);margin-top:3px">Try editing marks inside the JSON file in Notepad and dropping it here to test forgery detection</div>
          <input type="file" id="oFile" accept=".json,application/json" hidden>
        </label>
        <textarea id="oJson" placeholder='Paste exported proof JSON here (from "Export Proof JSON" on any verified credential)…'></textarea>
        <details style="margin-top:10px">
          <summary style="cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2)">Pinned Ledger Root Public Key (Ed25519 PEM — Optional Override)</summary>
          <textarea id="oPub" style="min-height:92px;margin-top:8px;font-size:11.5px" placeholder="-----BEGIN PUBLIC KEY-----&#10;...&#10;-----END PUBLIC KEY-----">${esc(pinnedKeys.ledger_pub||'')}</textarea>
        </details>
        <div class="between" style="margin-top:12px">
          <span class="mono">100% client-side · Works even if the server is offline</span>
          <button type="button" id="oRun">Verify Offline Bundle</button>
        </div>
      </div>
    </div>
    <div id="oOut"></div>`;

  const readJsonFile=f=>{
    if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{$('#oJson').value=String(rd.result||'');toast(`Loaded ${f.name}`);runOffline();};
    rd.readAsText(f);
  };
  $('#oFile').onchange=e=>readJsonFile(e.target.files?.[0]);
  const dz=$('#odz');
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag');};
  dz.ondragleave=()=>dz.classList.remove('drag');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('drag');readJsonFile(e.dataTransfer.files?.[0]);};

  async function runOffline(){
    const out=$('#oOut');
    if(!hasSubtle){
      out.innerHTML='<div class="status-bar err"><div class="status-lead"><div class="status-ico">!</div><div><div class="status-title">WebCrypto Unavailable</div><div class="status-desc">Offline verification requires HTTPS or localhost.</div></div></div></div>';
      return;
    }
    let bundle;
    try{bundle=JSON.parse($('#oJson').value);}
    catch{
      out.innerHTML='<div class="status-bar err"><div class="status-lead"><div class="status-ico">✕</div><div><div class="status-title">Malformed JSON Bundle</div><div class="status-desc">Could not parse the uploaded file as valid JSON.</div></div></div></div>';
      return;
    }
    if(!bundle?.record||!bundle?.batch||!Array.isArray(bundle?.proof)){
      out.innerHTML='<div class="status-bar err"><div class="status-lead"><div class="status-ico">✕</div><div><div class="status-title">Incomplete Proof Bundle</div><div class="status-desc">Expected fields: <code>record</code>, <code>leaf</code>, <code>proof[]</code>, and <code>batch</code>.</div></div></div></div>';
      return;
    }

    const pubPem=$('#oPub').value.trim()||pinnedKeys.ledger_pub;
    if(!pubPem){
      out.innerHTML='<div class="status-bar warn"><div class="status-lead"><div class="status-ico">!</div><div><div class="status-title">Pinned Public Key Required</div><div class="status-desc">Paste the registry Ed25519 public key (from Trust Anchors) so the signature can be verified offline.</div></div></div></div>';
      return;
    }

    const t0=performance.now();
    const r=bundle.record, b=bundle.batch;
    const calcLeaf=await leafOf(r);
    const {root:calcRoot,steps}=await traceMerkle(calcLeaf,bundle.proof);
    const calcHead=await headOf(b);
    const sigOk=await verifyEd25519(pubPem,b.head,b.sig);

    const leafOk=calcLeaf===bundle.leaf;
    const rootOk=calcRoot===b.root;
    const headOk=calcHead===b.head;

    let corrOk=true, corrChecked=false;
    if(r.version>1){
      corrChecked=true;
      const d=await corrDigestOf(r);
      const validAdmins=new Set();
      const adminPubs=pinnedKeys.admin_pubs||{};
      let hasAnyPub=false;
      for(const [aid,sig] of (r.approvals||[])){
        const apub=adminPubs[aid];
        if(!apub)continue;
        hasAnyPub=true;
        if(await verifyEd25519(apub,d,sig)===true) validAdmins.add(aid);
      }
      corrOk=hasAnyPub?validAdmins.size>=2:null;
    }

    const valid=leafOk&&rootOk&&headOk&&sigOk===true&&corrOk!==false;
    const ms=(performance.now()-t0).toFixed(1);

          ${chkRow('Batch Header Integrity','Recomputed SHA-256 header digest matches batch.head',headOk)}

      </div>`;
  }

}

/* --- TAB 1: SINGLE CREDENTIAL VERIFIER --- */
async function runVerify(s,c,h){
  const out=$('#vout');
  if(!hasSubtle){
    out.innerHTML=`<div class="status-bar err"><div class="status-lead"><div class="status-ico">!</div><div><div class="status-title">Secure Context Required</div><div class="status-desc">Browser WebCrypto requires HTTPS or localhost to verify proofs independently.</div></div></div></div>`;
    return;
  }
  out.innerHTML='<div class="panel"><div class="empty">Running WebCrypto verification pipeline…</div></div>';
  const t0=performance.now();
  const [{j:res},{j:cp}]=await Promise.all([api(`/api/result?s=${enc(s)}${c?'&c='+enc(c):''}`),api('/api/checkpoints')]);
  if(!res.results?.length){
    out.innerHTML=`<div class="status-bar err"><div class="status-lead"><div class="status-ico">✕</div><div><div class="status-title">No Published Credential Found</div><div class="status-desc">No ledger record exists for student "${esc(s)}"${c?` in course "${esc(c)}"`:''}.</div></div></div></div>`;
    return;
  }

  const cpMap=new Map();
  let prev=GENESIS, chainBroken=false;
  for(const k of cp.checkpoints){
    const calcHead=await headOf(k);
    const sigOk=await verifyEd25519(cp.ledger_pub,k.head,k.sig);
    const linkOk=k.prev===prev && calcHead===k.head && !chainBroken;
    if(!linkOk || sigOk===false) chainBroken=true;
    cpMap.set(k.n,{cp:k,linkOk,sigOk});
    prev=k.head;
  }

  const verifiedItems=[];
  for(const x of res.results){
    const leaf=await leafOf(x.record);
    const meta=cpMap.get(x.record.batch);
    const cpb=meta?.cp;
    const {root:calcRoot,steps}=await traceMerkle(leaf,x.proof);
    const leafOk=leaf===x.leaf;
    const rootOk=!!cpb&&calcRoot===cpb.root;
    const chainOk=!!meta?.linkOk;
    const sigOk=meta?meta.sigOk:false;

    let corrOk=true, corrChecked=false;
    if(x.record.version>1){
      corrChecked=true;
      const d=await corrDigestOf(x.record);
      const validAdmins=new Set();
      let unsupported=false;
      for(const [aid,sig] of (x.record.approvals||[])){
        const pub=cp.admin_pubs?.[aid];
        if(!pub) continue;
        const ok=await verifyEd25519(pub,d,sig);
        if(ok===null){unsupported=true;break;}
        if(ok) validAdmins.add(aid);
      }
      corrOk=unsupported?null:validAdmins.size>=2;
    }

    const qrOk=h?h===leaf:null;
    const valid=leafOk&&rootOk&&chainOk&&sigOk!==false&&corrOk!==false&&qrOk!==false;
    verifiedItems.push({x,leaf,calcRoot,steps,leafOk,rootOk,chainOk,sigOk,corrOk,corrChecked,qrOk,valid});
  }
  const elapsed=(performance.now()-t0).toFixed(1);

  const anyQr=h&&verifiedItems.some(v=>v.leaf===h);
  const qrWarn=h&&!anyQr?`<div class="status-bar err"><div class="status-lead"><div class="status-ico">✕</div><div><div class="status-title">Forged or Mismatched QR Code</div><div class="status-desc">The scanned QR digest does not match any published record for this student. Treat this document as tampered.</div></div></div></div>`:'';

  const html=verifiedItems.map((v,idx)=>{
    const {x,leaf,calcRoot,steps,leafOk,rootOk,chainOk,sigOk,corrOk,corrChecked,qrOk,valid}=v;
    const r=x.record;
    const cls=!valid?'err':x.superseded?'warn':'ok';
    const ico=!valid?'✕':x.superseded?'!':'✓';
    const title=!valid?'Verification Failed — Tampering Detected':x.superseded?'Authentic Historical Record (Superseded)':'Cryptographically Verified · Current Record';
    const desc=!valid?'One or more client-side cryptographic checks failed against the signed external checkpoint.'
      :x.superseded?'This record is authentic but has been officially replaced by a newer two-admin signed correction.'
      :`All proofs verified locally via WebCrypto in ${elapsed} ms against signed Checkpoint #${x.batch.n}.`;

    const chkRow=(name,detail,ok)=>`<div class="check-item">
      <div class="check-left">
        <span class="check-dot ${ok===null?'na':ok?'ok':'err'}"></span>
        <div>
          <div style="font-weight:500">${name}</div>
          <div style="font-size:11.5px;color:var(--mute)">${detail}</div>
        </div>
      </div>
      <span class="badge ${ok===null?'warn':ok?'ok':'err'}">${ok===null?'SERVER ONLY':ok?'PASS':'FAIL'}</span>
    </div>`;

    const link=qrLink({student_id:r.student_id,course:r.course,leaf:x.leaf});
    return `<div style="margin-bottom:26px">
      <div class="status-bar ${cls}">
        <div class="status-lead">
          <div class="status-ico">${ico}</div>
          <div>
            <div class="status-title">${title}</div>
            <div class="status-desc">${desc}</div>
          </div>
        </div>
        <div class="row noprint">
          <button type="button" class="ghost sm" data-dlproof="${idx}">Export Proof JSON</button>
          <a href="${sheetLink({student_id:r.student_id,course:r.course,leaf:x.leaf})}"><button type="button" class="sm">Official Marksheet</button></a>
        </div>
      </div>

      <div class="verify-grid">
        <div>
          <div class="stat-strip">
            <div class="stat-cell"><div class="stat-k">Student ID</div><div class="stat-v">${esc(r.student_id)}</div></div>
            <div class="stat-cell"><div class="stat-k">Course</div><div class="stat-v">${esc(r.course)}</div></div>
            <div class="stat-cell"><div class="stat-k">Marks Awarded</div><div class="stat-v">${r.marks}<span style="font-size:13px;color:var(--mute);font-weight:500"> / 100</span></div></div>
            <div class="stat-cell"><div class="stat-k">Version &amp; Batch</div><div class="stat-v">v${r.version} <span class="badge ${x.superseded?'warn':'ok'}" style="vertical-align:middle">${x.superseded?'Superseded':'Current'}</span></div><div class="stat-s">Batch #${x.batch.n} · ${new Date(x.batch.ts).toLocaleDateString()}</div></div>
          </div>

          ${r.reason?`<div class="panel">
            <div class="panel-head"><h2 class="panel-title">Two-Admin Signed Correction Attestation</h2><span class="badge ok">2-of-3 Multi-Sig</span></div>
            <div class="panel-body">
              <div style="font-size:13.5px;margin-bottom:8px"><b>Documented Reason:</b> ${esc(r.reason)}</div>
              <div class="row">
                ${r.approvals.map(a=>`<span class="badge neutral">Signed by ${esc(a[0])} (Ed25519)</span>`).join('')}
                <span class="mono">Supersedes: ${esc((r.supersedes||'').slice(0,22))}…</span>
              </div>
            </div>
          </div>`:''}

          <div class="panel">
            <div class="panel-head">
              <div><h2 class="panel-title">Client-Side Cryptographic Checks</h2><div class="panel-sub">Computed independently from raw payload &amp; external checkpoints</div></div>
              <span class="mono">${elapsed} ms</span>
            </div>
            <div class="check-list">
              ${chkRow('Canonical Leaf Digest','SHA-256(0x00 || canonical_v1_array) matches stored leaf',leafOk)}
              ${chkRow('Merkle Inclusion Proof',`${steps.length} domain-separated 0x01 fold step${steps.length===1?'':'s'} match checkpoint root`,rootOk)}
              ${chkRow('Append-Only Hash Chain',`Batch #${x.batch.n} header hash & prev-head pointer valid from genesis`,chainOk)}
              ${chkRow('Ledger Ed25519 Signature','Batch head signature verified against root public key',sigOk)}
              ${corrChecked?chkRow('Two-Admin Correction Signatures','2 distinct registrar Ed25519 signatures over correction digest',corrOk):''}
              ${h?chkRow('QR Code Digest Binding','Scanned QR hash matches recomputed record leaf exactly',qrOk):''}
            </div>
          </div>

          <div class="panel">
            <div class="panel-head">
              <div><h2 class="panel-title">Interactive Merkle Inclusion Path</h2><div class="panel-sub">Bottom-up SHA-256 hash folding from leaf record to signed batch root</div></div>
              <span class="badge neutral">${steps.length} level${steps.length===1?'':'s'}</span>
            </div>
            <div class="panel-body">
              <div class="merkle-flow">
                <div class="m-node">
                  <div class="m-head"><span>Level 0 · Record Leaf (0x00 || canon)</span><button type="button" class="subtle xs" data-copy="${leaf}" data-label="Leaf hash">Copy</button></div>
                  <div class="mono">${leaf}</div>
                </div>
                ${steps.map(st=>`
                  <div class="m-arrow">↓ combine with ${st.side==='L'?'LEFT':'RIGHT'} sibling: ${st.sibling.slice(0,24)}…</div>
                  <div class="m-node ${st.level===steps.length&&rootOk?'root':''}">
                    <div class="m-head"><span>Level ${st.level}${st.level===steps.length?' · Recomputed Merkle Root':''}</span><button type="button" class="subtle xs" data-copy="${st.result}" data-label="Level ${st.level} hash">Copy</button></div>
                    <div class="mono">${st.result}</div>
                  </div>`).join('')}
                ${steps.length===0?`<div class="m-node ${rootOk?'root':''}"><div class="m-head"><span>Single-Leaf Batch · Leaf Equals Merkle Root</span><button type="button" class="subtle xs" data-copy="${calcRoot}" data-label="Merkle root">Copy</button></div><div class="mono">${calcRoot}</div></div>`:''}
              </div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><h2 class="panel-title">Verification QR</h2><span class="badge neutral">v${r.version}</span></div>
          <div class="panel-body" style="text-align:center">
            <img class="qr-card" alt="Verification QR" src="/api/qr?text=${enc(link)}">
            <div style="font-size:12px;color:var(--mute);margin:10px 0 12px">Scan on any device to verify without logging in.</div>
            <div style="display:flex;flex-direction:column;gap:7px">
              <button type="button" class="ghost sm" data-copy="${link}" data-label="Verify URL">Copy Verification Link</button>
              <a href="${sheetLink({student_id:r.student_id,course:r.course,leaf:x.leaf})}" style="width:100%"><button type="button" class="subtle sm" style="width:100%">Print Official Marksheet</button></a>
            </div>
            <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);text-align:left">
              <div class="stat-k">Signed Batch Head</div>
              <div class="mono" style="margin-bottom:8px">${x.batch.head.slice(0,28)}…</div>
              <div class="stat-k">Timestamp</div>
              <div style="font-size:12px;color:var(--ink-2)">${new Date(x.batch.ts).toLocaleString()}</div>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  out.innerHTML=qrWarn+html;
  out.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyVal(b.dataset.copy,b.dataset.label));
  out.querySelectorAll('[data-dlproof]').forEach(b=>b.onclick=()=>{
    const v=verifiedItems[Number(b.dataset.dlproof)];
    downloadJson(`proof-${v.x.record.student_id}-${v.x.record.course}-v${v.x.record.version}.json`,{
      protocol:'result-ledger-v1',
      exported_at:new Date().toISOString(),
      record:v.x.record,
      leaf:v.leaf,
      proof:v.x.proof,
      batch:v.x.batch
    });
    toast('Offline proof bundle downloaded');
  });
}

function parseCsvPreview(text){
  const lines=String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const rows=[];
  lines.forEach((line,i)=>{
    if(i===0 && /^student_id\s*,/i.test(line)) return;
    const parts=line.split(',').map(x=>x.trim());
    const [s,c,mRaw]=parts;
    const m=Number(mRaw);
    const err=!s||!c?'Missing student ID or course':mRaw===''||Number.isNaN(m)||m<0||m>100?'Marks must be 0–100':null;
    rows.push({student_id:s||'',course:c||'',marks:mRaw||'',err});
  });
  return rows;
}

          <div class="check-item"><div class="check-left"><span class="check-dot ok"></span><span>Pending correction digest &amp; in-flight admin signature integrity check</span></div><span class="badge ok">CLEAN</span></div>
          <div class="check-item"><div class="check-left"><span class="check-dot ok"></span><span>Genesis-to-head append-only hash chain continuity</span></div><span class="badge ok">CLEAN</span></div>
        </div>
      </div>`}`;
  };
  $('#runAuditBtn').onclick=run;
  $('#dlAuditBtn').onclick=()=>{
    if(!lastReport)return;
    downloadJson(`audit-report-${Date.now()}.json`,lastReport);
    toast('Forensic audit report downloaded');
  };
  run();
}
</script>
